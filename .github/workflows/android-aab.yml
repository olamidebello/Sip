name: Build Olamide SIP + VPN Android Bundle

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/web/**"
      - "apps/mobile/**"
      - ".github/workflows/android-aab.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies and build UI
        working-directory: apps/web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prepare Capacitor web assets
        working-directory: apps/mobile
        run: |
          mkdir -p www
          cp -a ../web/dist/. www/

      - name: Add and sync Android project
        working-directory: apps/mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Set unique Play Store version code
        working-directory: apps/mobile/android
        env:
          PLAY_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("app/build.gradle")
          if not p.exists():
              p = Path("app/build.gradle.kts")
          content = p.read_text()
          version_code = 10000 + int(os.environ["PLAY_VERSION_CODE"])
          updated, count = re.subn(r"\bversionCode\s*(?:=\s*)?\d+", f"versionCode {version_code}" if p.suffix != ".kts" else f"versionCode = {version_code}", content, count=1)
          if count != 1:
              raise SystemExit("Cannot find Android versionCode; refusing to produce a potentially non-upgradeable bundle")
          p.write_text(updated)
          print(f"Set versionCode to {version_code}")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android App Bundle
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            # Configure the generated Android project to sign the release bundle with the supplied upload key.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          if not p.exists():
              p = Path("app/build.gradle.kts")
          if p.suffix == ".kts":
              s = p.read_text()
              marker = "android {"
              signing = """
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
              s = s.replace(marker, marker + signing, 1)
              s = s.replace('buildTypes {', 'buildTypes {\n        getByName("release") { signingConfig = signingConfigs.getByName("release") }', 1)
          else:
              s = p.read_text()
              marker = "android {"
              signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_PATH') ?: '')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
          """
              s = s.replace(marker, marker + signing, 1)
              s = s.replace("buildTypes {", "buildTypes {\n        release { signingConfig signingConfigs.release }", 1)
          p.write_text(s)
          PY
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
            ./gradlew bundleRelease assembleRelease
          else
            echo "::error::Missing ANDROID_KEYSTORE_BASE64. Configure a persistent upload key before building a Play Store release."
            exit 1
          fi

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: olamide-sip-vpn-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable signed APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: olamide-sip-vpn-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
