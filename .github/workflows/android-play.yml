name: Android Play preparation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-play.yml', 'apps/mobile/**', 'apps/web/public/olamide-logo.jpg']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Generate existing Android app
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund && npx cap add android && npx cap sync android && bash install-carrier-native.sh && python3 install-vpn-native.py
      - name: Configure current Play SDK and unique version
        env:
          OLAMIDE_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 tests/test_play_release.py
          export OLAMIDE_ANDROID_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          python3 apps/mobile/prepare-play-release.py
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Apply original Olamide logo to Android and Play artwork
        run: python3 -m pip install Pillow==11.3.0 && python3 apps/mobile/generate-brand-artwork.py
      - uses: actions/upload-artifact@v4
        with:
          name: olamide-play-artwork
          path: apps/mobile/play-artwork/
      - name: Build APK and release bundle
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug assembleRelease bundleRelease
      - name: Sign bundle only with configured release key
        id: signing
        working-directory: apps/mobile/android
        env:
          CARRIER_KEYSTORE_B64: ${{ secrets.CARRIER_KEYSTORE_B64 }}
          CARRIER_KEY_ALIAS: ${{ secrets.CARRIER_KEY_ALIAS }}
          CARRIER_KEYSTORE_PASSWORD: ${{ secrets.CARRIER_KEYSTORE_PASSWORD }}
          CARRIER_KEY_PASSWORD: ${{ secrets.CARRIER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p play-output
          cp app/build/outputs/apk/debug/app-debug.apk play-output/Olamide-debug.apk
          if [[ -n "$CARRIER_KEYSTORE_B64" && -n "$CARRIER_KEY_ALIAS" && -n "$CARRIER_KEYSTORE_PASSWORD" && -n "$CARRIER_KEY_PASSWORD" ]]; then
            umask 077
            trap 'rm -f "$RUNNER_TEMP/play-upload.jks"' EXIT
            printf '%s' "$CARRIER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/play-upload.jks"
            jarsigner -keystore "$RUNNER_TEMP/play-upload.jks" -storepass:env CARRIER_KEYSTORE_PASSWORD -keypass:env CARRIER_KEY_PASSWORD -signedjar play-output/Olamide-release.aab app/build/outputs/bundle/release/app-release.aab "$CARRIER_KEY_ALIAS"
            jarsigner -verify play-output/Olamide-release.aab
            tools="$ANDROID_HOME/build-tools/36.0.0"
            "$tools/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned-release.apk"
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/play-upload.jks" --ks-key-alias "$CARRIER_KEY_ALIAS" --ks-pass env:CARRIER_KEYSTORE_PASSWORD --key-pass env:CARRIER_KEY_PASSWORD --out play-output/Olamide-release.apk "$RUNNER_TEMP/aligned-release.apk"
            "$tools/apksigner" verify --verbose play-output/Olamide-release.apk
            rm -f "$RUNNER_TEMP/aligned-release.apk"
            echo 'Release bundle signed with configured carrier key. Verify this key matches the Play upload certificate before submitting.' > play-output/STATUS.txt
          else
            cp app/build/outputs/bundle/release/app-release.aab play-output/Olamide-UNSIGNED.aab
            echo 'Signing key not configured. Debug APK is for testing only. UNSIGNED bundle cannot be submitted to Google Play.' > play-output/STATUS.txt
          fi
          printf '%s\n' "$GITHUB_SHA" > play-output/SOURCE_COMMIT.txt
          printf '%s\n' 'Package: com.dobhrap.olamide. Target API: 36. Hosted-web preview; physical-device and policy acceptance required. No Play submission performed.' >> play-output/STATUS.txt
          cat play-output/STATUS.txt >> "$GITHUB_STEP_SUMMARY"
          cd play-output && sha256sum *.apk *.aab > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: olamide-android-play-preparation
          path: apps/mobile/android/play-output/
          if-no-files-found: error

      - name: Verify embedded VPN and publish Android development download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p vpn-output
          cp apps/mobile/android/play-output/Olamide-debug.apk vpn-output/Olamide-VPN-preview.apk
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path('vpn-output/Olamide-VPN-preview.apk')
          with zipfile.ZipFile(p) as z:
              assert any(n.endswith('libwg-go.so') for n in z.namelist()), 'WireGuard native engine missing'
              assert any(b'OlamideVpnPlugin' in z.read(n) for n in z.namelist() if n.endswith('.dex')), 'VPN plugin missing'
          PY
          printf '%s\n' "$GITHUB_SHA" > vpn-output/SOURCE_COMMIT.txt
          cd vpn-output
          sha256sum Olamide-VPN-preview.apk > SHA256SUMS
          printf '%s\n' 'Android development APK with embedded WireGuard. Android VPN permission is required. Server VPN provisioning must be installed first. Debug signing is for testing; store release requires the configured production signing key.' > NOTES.txt
          gh release view vpn-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create vpn-preview --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Olamide embedded VPN — Android development preview' --notes-file NOTES.txt
          gh release upload vpn-preview ./* --repo "$GITHUB_REPOSITORY" --clobber
