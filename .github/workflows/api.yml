name: Account API checks
on:
  push:
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: olamide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/olamide_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check server.js
