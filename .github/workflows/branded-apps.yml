name: Olamide branded apps
on:
  workflow_dispatch:
  push:
    branches: [codex/branded-app-build]
    paths: ['.github/workflows/branded-apps.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: apps/desktop
      - name: Generate Olamide application icons
        run: python3 -m pip install --break-system-packages pillow && python3 tools/build-app-icons.py
      - run: npm run dist -- --${{ matrix.platform }}
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: olamide-desktop-${{ matrix.platform }}
          path: apps/desktop/dist/
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: npm install --no-audit --no-fund && npx cap add android && npx cap sync android && bash install-carrier-native.sh
        working-directory: apps/mobile
      - name: Generate Olamide application icons
        run: python3 -m pip install --break-system-packages pillow && python3 tools/build-app-icons.py
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: olamide-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Check carrier signing configuration
        id: carrier_secrets
        env:
          CARRIER_KEYSTORE_B64: ${{ secrets.CARRIER_KEYSTORE_B64 }}
          CARRIER_KEY_ALIAS: ${{ secrets.CARRIER_KEY_ALIAS }}
          CARRIER_KEYSTORE_PASSWORD: ${{ secrets.CARRIER_KEYSTORE_PASSWORD }}
          CARRIER_KEY_PASSWORD: ${{ secrets.CARRIER_KEY_PASSWORD }}
        run: |
          if [[ -n "$CARRIER_KEYSTORE_B64" && -n "$CARRIER_KEY_ALIAS" && -n "$CARRIER_KEYSTORE_PASSWORD" && -n "$CARRIER_KEY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build carrier signed APK when operator-approved key is configured
        if: ${{ steps.carrier_secrets.outputs.ready == 'true' }}
        working-directory: apps/mobile/android
        env:
          CARRIER_KEYSTORE_B64: ${{ secrets.CARRIER_KEYSTORE_B64 }}
          CARRIER_KEY_ALIAS: ${{ secrets.CARRIER_KEY_ALIAS }}
          CARRIER_KEYSTORE_PASSWORD: ${{ secrets.CARRIER_KEYSTORE_PASSWORD }}
          CARRIER_KEY_PASSWORD: ${{ secrets.CARRIER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$CARRIER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/olamide-carrier.jks"
          ./gradlew assembleRelease
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/olamide-aligned.apk"
          mkdir -p carrier-output
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/olamide-carrier.jks" --ks-key-alias "$CARRIER_KEY_ALIAS" --ks-pass env:CARRIER_KEYSTORE_PASSWORD --key-pass env:CARRIER_KEY_PASSWORD --out carrier-output/olamide-carrier-signed.apk "$RUNNER_TEMP/olamide-aligned.apk"
          "$build_tools/apksigner" verify carrier-output/olamide-carrier-signed.apk
          rm -f "$RUNNER_TEMP/olamide-carrier.jks" "$RUNNER_TEMP/olamide-aligned.apk"
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('apps/mobile/android/carrier-output/olamide-carrier-signed.apk') != '' }}
        with:
          name: olamide-carrier-signed
          path: apps/mobile/android/carrier-output/olamide-carrier-signed.apk
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund && npx cap add ios && npx cap sync ios && python3 configure-contacts.py
        working-directory: apps/mobile
      - name: Generate Olamide application icons
        run: python3 -m pip install --break-system-packages pillow && python3 tools/build-app-icons.py
      - name: Build iOS simulator app without device signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: olamide-ios-simulator
          path: apps/mobile/build/Build/Products/Debug-iphonesimulator/App.app/
          if-no-files-found: error
  publish:
    needs: [desktop, android, ios-simulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - name: Publish branded apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp downloads/olamide-android-debug-apk/*.apk OlamideSip.apk
          sha256sum OlamideSip.apk > OlamideSip.apk.sha256
          gh release create branded-preview-20261018 OlamideSip.apk OlamideSip.apk.sha256 downloads/olamide-desktop-linux/*.AppImage downloads/olamide-desktop-win/*.exe downloads/olamide-desktop-mac/*.dmg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Olamide branded apps' --notes 'Olamide logo on mobile and desktop app icons and installers. Android debug APK; desktop installers unsigned. iOS simulator available in Actions artifacts.' --prerelease
