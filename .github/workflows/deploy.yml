name: Validate Olamide for server pull
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: olamide_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pmysql"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      TEST_MYSQL_URL: mysql://root:mysql@127.0.0.1:3306/olamide_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: API checks
        working-directory: services/api
        run: npm install --no-audit --no-fund && npm test
      - name: Browser checks and build
        working-directory: apps/web
        run: npm install --no-audit --no-fund && npm test && npm run build
