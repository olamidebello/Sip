name: Validate Olamide for server pull
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: olamide_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pmysql"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      TEST_MYSQL_URL: mysql://root:mysql@127.0.0.1:3306/olamide_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deployment configuration checks
        run: |
          bash -n deployment/bootstrap.sh deployment/install-all.sh deployment/install.sh deployment/install-ansible.sh deployment/update.sh deployment/verified-sha.sh deployment/docker/turn-entrypoint.sh
          bash -n deployment/deploy-production.sh deployment/deploy-chat-experience.sh deployment/deploy-message-privacy.sh deployment/deploy-chat-money.sh deployment/deploy-sip-registration-repair.sh deployment/deploy-subscriber-delivery.sh deployment/deploy-contact-discovery.sh
          python3 tools/test_production_deployment.py
          python3 tools/test_native_push_install.py
          python3 -m py_compile deployment/production/runtime-secrets.py deployment/production/release.py deployment/production/check-public.py
          sudo apt-get update
          sudo apt-get install -y ansible
          python3 -m unittest tools/test_astpp_commissioning_check.py tools/test_kamailio_cleanup.py
          python3 -m unittest discover -s services/carrier-adapter -p 'test_*.py'
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/astpp-commissioning-check.yml
          bash -n deployment/check-astpp-commissioning.sh
          python3 -m unittest tools/test_native_astpp_deployment.py
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/carrier-console.yml
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/native-astpp-gui.yml
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/optional-native-astpp.yml
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/astpp-features.yml
          bash -n deployment/deploy-astpp-features.sh deployment/deploy-telecom-features.sh
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/telecom-features.yml
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/advanced-astpp-navigation.yml
          bash -n deployment/deploy-advanced-astpp-navigation.sh deployment/deploy-astpp-application.sh
          python3 -m unittest tools/test_telecom_requirements.py
          bash -n deployment/deploy-native-astpp.sh deployment/deploy-kamailio-paid-calls.sh
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/kamailio-paid-calls.yml
          python3 tools/test_prepare_kamailio_paid_route.py
          python3 -m unittest discover -s services/carrier-adapter -p 'test_*.py'
          bash -n deployment/deploy-carrier-console.sh
          bash -n deployment/deploy-flowroute-gateway.sh
          python3 -m unittest tools/test_import_flowroute_pdf.py
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/flowroute-gateway.yml
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/flowroute-gateway-interactive.yml
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/flowroute-gateway-gui.yml
          python3 -m unittest tools/test_flowroute_interactive.py
          python3 tools/test_chat_experience_deployment.py
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/chat-experience.yml
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/message-privacy.yml
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/chat-money.yml
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/sip-registration-repair.yml
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/subscriber-delivery.yml
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/contact-discovery.yml
          ansible-playbook --syntax-check -i 'localhost,' deploy/ansible/subscriber-routing.yml
          python3 tools/test_local_sip_domain_repair.py
          ansible-playbook --syntax-check -i deployment/production/inventory.example.ini deployment/ansible/production.yml
          ansible-playbook --syntax-check -i deployment/native-push/inventory.example.ini deployment/ansible/native-system-calls.yml
          ansible-playbook --syntax-check -i deployment/native-push/inventory.example.ini deployment/ansible/native-server-access.yml
          ansible-playbook --syntax-check -i 'localhost,' deployment/ansible/site.yml
          ansible-playbook --syntax-check -i 'localhost,' deployment/ansible/switch.yml
          docker compose --env-file deployment/secrets.env.example -f deployment/docker/compose.yml config -q
          docker compose --profile turn --env-file deployment/secrets.env.example -f deployment/docker/compose.yml config -q
          docker build -f deployment/docker/turn.Dockerfile -t olamide-turn-ci .
      - name: API checks
        timeout-minutes: 5
        working-directory: services/api
        run: |
          npm install --no-audit --no-fund
          MYSQL_URL="$TEST_MYSQL_URL" timeout 90s node migrate.js
          MYSQL_URL="$TEST_MYSQL_URL" timeout 90s node migrate.js
          timeout 120s npm test
      - name: Browser checks and build
        working-directory: apps/web
        run: npm install --no-audit --no-fund && npm test && npm run build



  native_astpp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test isolated native ASTPP GUI
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import os,pathlib,runpy; runpy.run_path("tools/prepare_native_astpp.py")["prepare"](pathlib.Path(os.environ["RUNNER_TEMP"])/"native-astpp")' 
          docker compose -p olamide-native-astpp --env-file "$RUNNER_TEMP/native-astpp/runtime.env" -f deployment/native-astpp/compose.yml build native-web
          docker run --rm --entrypoint sh olamide-native-astpp-native-web -c 'cat /usr/src/astpp/database/astpp-6.0.sql; printf "\n"; cat /usr/src/astpp/database/astpp-6.0.1.sql' > "$RUNNER_TEMP/native-astpp/schema.sql"
          python3 deployment/native-astpp/sanitize_sql.py "$RUNNER_TEMP/native-astpp/schema.sql" > "$RUNNER_TEMP/native-astpp/bootstrap.sql"
          chmod 644 "$RUNNER_TEMP/native-astpp/bootstrap.sql"
          docker compose -p olamide-native-astpp --env-file "$RUNNER_TEMP/native-astpp/runtime.env" -f deployment/native-astpp/compose.yml up -d
          for attempt in $(seq 1 24); do
            if curl -fsS http://127.0.0.1:8089/ -o "$RUNNER_TEMP/native-login.html" && grep -qi password "$RUNNER_TEMP/native-login.html"; then break; fi
            sleep 5
          done
          python3 tools/native_astpp_smoke.py --directory "$RUNNER_TEMP/native-astpp"
          docker compose -p olamide-native-astpp --env-file "$RUNNER_TEMP/native-astpp/runtime.env" -f deployment/native-astpp/compose.yml exec -T native-web php /usr/local/lib/native-astpp/verify_menus.php
          for stage in accounts carriers rates billing numbers products reports settings; do docker compose -p olamide-native-astpp --env-file "$RUNNER_TEMP/native-astpp/runtime.env" -f deployment/native-astpp/compose.yml exec -T native-web php /usr/local/lib/native-astpp/verify_menus.php "$stage"; done
      - name: Report native runtime failures
        if: failure()
        run: docker logs olamide-native-astpp-native-db-1 --tail 40; docker logs olamide-native-astpp-native-web-1 --tail 40

