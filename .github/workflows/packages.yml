name: Downloadable Olamide apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/web/**'
      - 'apps/desktop/**'
      - 'apps/mobile/**'
      - '.github/workflows/packages.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund && npm test && npm run build
        working-directory: apps/web
      - name: Browser ZIP
        run: cd apps/web/dist && zip -qr ../../../olamide-browser.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: olamide-browser
          path: olamide-browser.zip
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: apps/desktop
      - run: npm run dist -- --${{ matrix.platform }}
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: olamide-desktop-${{ matrix.platform }}
          path: apps/desktop/dist/
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund && npx cap add android && npx cap sync android
        working-directory: apps/mobile
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: olamide-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund && npx cap add ios && npx cap sync ios
        working-directory: apps/mobile
      - name: Build iOS simulator app without device signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: olamide-ios-simulator
          path: apps/mobile/build/Build/Products/Debug-iphonesimulator/App.app/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [browser, desktop, android, ios-simulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - name: Publish public downloadable files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd downloads
          find . -type f -print
          gh release create "$GITHUB_REF_NAME" \
            olamide-browser/olamide-browser.zip \
            olamide-android-debug-apk/*.apk \
            olamide-desktop-linux/*.AppImage \
            olamide-desktop-linux/*.deb \
            olamide-desktop-win/*.exe \
            olamide-desktop-mac/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "Olamide $GITHUB_REF_NAME" \
            --notes 'Pre-release builds. Android is a debug APK. Windows and macOS desktop installers are unsigned. iOS simulator builds are in Actions artifacts, not installable on physical iPhones.' \
            --prerelease
