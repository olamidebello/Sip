---
- name: Inventory native ASTPP runtime and existing carrier switch without changing traffic
  hosts: switch_nodes
  become: true
  tasks:
    - name: Collect credential-safe runtime inventory
      ansible.builtin.command:
        argv: [python3, /opt/olamide/repo/tools/astpp_commissioning_check.py, '--production-backend', '{{ astpp_check_backend | default("kamailio") }}']
      register: astpp_inventory
      changed_when: false
      failed_when: astpp_inventory.rc not in [0, 2]
    - name: Report GUI state and remaining native acceptance checks
      ansible.builtin.debug:
        msg: '{{ astpp_inventory.stdout | from_json }}'
    - name: Require readiness for the selected backend
      ansible.builtin.assert:
        that: astpp_inventory.rc == 0
        fail_msg: Review the reported backend readiness checks. This inventory has not changed any live routes.
