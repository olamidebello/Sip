---
- name: Install authorized profile caller ID and super admin DID policy
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Back up local fixes and install reviewed integration
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        cd /opt/olamide/repo
        exec 9>/run/olamide-update.lock
        flock -n 9 || { echo 'Another update is running'; exit 1; }
        backup_dir="/opt/olamide/backups/caller-id-$(date -u +%Y%m%dT%H%M%S)-$$"
        install -d -m 0700 "$backup_dir"
        tar --exclude=.git --exclude=node_modules --exclude=dist -czf "$backup_dir/source.tar.gz" .
        git fetch origin main </dev/null
        git show origin/main:tools/install-caller-identity.py > "$backup_dir/install.py"
        cd deployment/docker
        docker compose exec -T mysql sh -c 'exec mysqldump --single-transaction --hex-blob -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' </dev/null 2>"$backup_dir/database.log" | gzip > "$backup_dir/database.sql.gz"
        gzip -t "$backup_dir/database.sql.gz"
        gzip -cd "$backup_dir/database.sql.gz" | tail -n 10 | grep -q 'Dump completed'
        python3 "$backup_dir/install.py"
        docker compose config --quiet </dev/null
        docker compose build api web </dev/null
        docker compose up -d --no-deps api web </dev/null
        curl -fsS --max-time 10 --retry 12 --retry-all-errors --retry-delay 3 https://sip.dobhrap.com/api/health
        echo "Caller-ID update installed; backup: $backup_dir"
      args:
        executable: /bin/bash
      register: result
      changed_when: true
    - ansible.builtin.debug:
        var: result.stdout_lines
