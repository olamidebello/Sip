- name: Publish enhanced in-app chat composer
  hosts: all
  become: true
  gather_facts: false
  tasks:
  - name: Require SIP platform server
    ansible.builtin.command: hostname -I
    register: chat_host
    changed_when: false
  - name: Check target
    ansible.builtin.assert:
      that: '''154.29.77.102'' in chat_host.stdout.split()'
      fail_msg: Run on SIP server 154.29.77.102
  - block:
    - name: Install chat GUI with backups and rollback
      ansible.builtin.shell: "set -euo pipefail\numask 077\nexec 9>/run/olamide-update.lock\nflock -n 9 || { echo 'Another deployment is running'; exit 1; }\ncd /opt/olamide/repo\nbackup=$(mktemp -d /opt/olamide/backups/chat-gui-XXXXXXXX)\nexec > \"$backup/deploy.log\" 2>&1\nfiles=(apps/web/src/conversations.js apps/web/src/messengerMedia.js apps/web/src/style.css apps/web/src/chatWritingTools.js apps/web/src/chatWritingTools.css)\nfor f in \"${files[@]}\"; do\n  test ! -L \"$f\"\n  mkdir -p \"$backup/source/$(dirname \"$f\")\"\n  if test -f \"$f\"; then cp -p \"$f\" \"$backup/source/$f\"; fi\ndone\ncd deployment/docker\nprintf 'services:\\n' > \"$backup/rollback.yml\"\nfor service in web; do\n  cid=$(docker compose ps -q \"$service\")\n  test -n \"$cid\"\n  image=$(docker inspect --format '{% raw %}{{.Image}}{% endraw %}' \"$cid\")\n  tag=\"olamide-$service:before-$(basename \"$backup\")\"\n  docker tag \"$image\" \"$tag\"\n  printf '  %s:\\n    image: %s\\n' \"$service\" \"$tag\" >> \"\
        $backup/rollback.yml\"\ndone\ncd ../..\npromoted=0\nrollback() {\n  trap - ERR\n  for f in \"${files[@]}\"; do\n    if test -f \"$backup/source/$f\"; then cp -p \"$backup/source/$f\" \"/opt/olamide/repo/$f\"; else rm -f \"/opt/olamide/repo/$f\"; fi\n  done\n  if test \"$promoted\" = 1; then\n    cd /opt/olamide/repo/deployment/docker\n    docker compose -f compose.yml -f \"$backup/rollback.yml\" up -d --no-deps web || true\n  fi\n  exit 1\n}\ntrap rollback ERR\npython3 '{{ playbook_dir }}/../../tools/apply_chat_gui.py' /opt/olamide/repo\ncd deployment/docker\napi_container=$(docker compose ps -q api)\ntest -n \"$api_container\"\napi_image=$(docker inspect --format '{% raw %}{{.Image}}{% endraw %}' \"$api_container\")\ndocker run --rm -i --network none --read-only --entrypoint node \"$api_image\" --input-type=module --check < ../../apps/web/src/conversations.js\nfor module in messengerMedia.js chatWritingTools.js; do\n  docker run --rm -i --network none --read-only --entrypoint node\
        \ \"$api_image\" --input-type=module --check < \"../../apps/web/src/$module\"\ndone\ndocker compose build web\ndocker compose run --rm --no-deps -T --entrypoint caddy web validate --config /etc/caddy/Caddyfile --adapter caddyfile\npromoted=1\ndocker compose up -d --no-deps web\ncurl -fsS --max-time 10 --retry 12 --retry-all-errors --retry-delay 3 https://sip.dobhrap.com/api/health\ntrap - ERR\n"
      args:
        executable: /bin/bash
      no_log: true
      changed_when: true
    rescue:
    - name: Report private diagnostic location
      ansible.builtin.fail:
        msg: 'Chat update failed. Previous source and web image restored where possible. Private log: /opt/olamide/backups/chat-gui-*/deploy.log'
  - name: Report chat GUI update
    ansible.builtin.debug:
      msg: Chat writing tools, drafts, media previews, camera shortcut and voice pause/resume installed. Refresh the app. Drafts use this tab session; media remains limited to one attachment up to 2 MB.
