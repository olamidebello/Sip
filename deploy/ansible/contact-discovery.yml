---
- name: Deploy validated subscriber delivery and contact discovery schemas
  ansible.builtin.import_playbook: subscriber-delivery.yml
- name: Report contact discovery controls
  hosts: switch_nodes
  become: true
  tasks:
    - name: Report required privacy and import settings
      ansible.builtin.debug:
        msg: 'Email and international phone search and in-app contact registration alerts installed. Users must enable discoverability to appear. Alerts use contacts already imported into Olamide and can be disabled or dismissed in Settings. This does not monitor phone contacts without permission or send OS push notifications.'
