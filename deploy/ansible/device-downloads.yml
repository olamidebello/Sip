---
- name: Install device-aware SIP downloads and update links
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Create private background call rollback directory
      ansible.builtin.tempfile:
        state: directory
        path: /opt/olamide/backups
        prefix: device-downloads-
      register: phone_backup
    - name: Back up, stage, validate and deploy device download controls
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        exec 9>/run/olamide-update.lock
        flock -n 9
        backup='{{ phone_backup.path }}'
        controller='{{ playbook_dir }}/../..'
        exec > "$backup/deploy.log" 2>&1
        cd /opt/olamide/repo
        python3 - "$backup" <<'PY'
        from pathlib import Path
        import sys,json,shutil
        root=Path('/opt/olamide/repo');b=Path(sys.argv[1]);names=['apps/web/src/downloads.js']+['apps/web/public/install/'+n for n in ['index.html','install.css','device-install.js']]
        manifest={}
        for name in names:
            p=root/name
            if p.is_symlink():raise SystemExit('Symlinked integration file refused')
            manifest[name]=p.exists()
            if p.exists():
                target=b/'source'/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,target)
        (b/'manifest.json').write_text(json.dumps(manifest))
        PY
        cd deployment/docker
        for svc in web; do
          container=$(docker compose ps -q "$svc")
          test -n "$container"
          image=$(docker inspect --format '{% raw %}{{.Image}}{% endraw %}' "$container")
          docker tag "$image" "olamide-$svc:phone-rollback-$(basename "$backup")"
        done
        printf 'services:\n  web:\n    image: olamide-web:phone-rollback-%s\n' "$(basename "$backup")" > "$backup/rollback.yml"
        promoted=0
        restore() {
          trap - ERR
          python3 - "$backup" <<'PY'
        import json,pathlib,shutil,sys
        b=pathlib.Path(sys.argv[1]);root=pathlib.Path('/opt/olamide/repo')
        for name,exists in json.loads((b/'manifest.json').read_text()).items():
            if exists:shutil.copy2(b/'source'/name,root/name)
            else:(root/name).unlink(missing_ok=True)
        PY
          if test "$promoted" = 1; then
            docker compose -f compose.yml -f "$backup/rollback.yml" up -d --no-deps web || true
          fi
          exit 1
        }
        trap restore ERR
        install -m 0644 "$controller/apps/web/src/downloads.js" /opt/olamide/repo/apps/web/src/downloads.js
        install -d /opt/olamide/repo/apps/web/public/install
        for name in index.html install.css device-install.js; do install -m 0644 "$controller/apps/web/public/install/$name" "/opt/olamide/repo/apps/web/public/install/$name"; done
        docker compose build web
        promoted=1
        docker compose up -d --no-deps web
        curl -fsS --max-time 10 --retry 12 --retry-all-errors --retry-delay 2 https://sip.dobhrap.com/api/health
        trap - ERR
      args:
        executable: /bin/bash
      no_log: true
      changed_when: true
    - name: Report device installation link
      ansible.builtin.debug:
        msg: 'Install/update: https://sip.dobhrap.com/install/ . Device detection recommends the appropriate published package. iPhone/iPad use browser installation. Backup/private log: {{ phone_backup.path }}'
