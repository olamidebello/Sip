- name: Enforce Flowroute cost plus thirty percent while preserving local billing fixes
  hosts: all
  become: true
  gather_facts: false
  tasks:
  - name: Back up, integrate, test and deploy monitoring
    ansible.builtin.shell: "set -euo pipefail\numask 077\ncd /opt/olamide/repo\nexec 9>/run/olamide-update.lock\nflock -n 9 || { echo 'Another deployment is running'; exit 1; }\nbackup_dir=\"/opt/olamide/backups/flowroute-markup-$(date -u +%Y%m%dT%H%M%S)-$$\"\ninstall -d -m 0700 \"$backup_dir\"\ngit fetch origin main </dev/null\nrelease=9983590015cf0eaccb724713592ce62c8b1e993c\ngit merge-base --is-ancestor \"$release\" origin/main\nfiles=(services/api/pstnBilling.js services/api/flowrouteCustomerRate.js services/api/flowrouteCustomerRate.test.js services/api/flowrouteSettlement.test.js)\nfor file in \"${files[@]}\"; do\n  mkdir -p \"$backup_dir/$(dirname \"$file\")\"\n  if test -f \"$file\"; then cp -p \"$file\" \"$backup_dir/$file\"; fi\ndone\nrestore_source() {\n  for file in \"${files[@]}\"; do\n    if test -f \"$backup_dir/$file\"; then cp -p \"$backup_dir/$file\" \"/opt/olamide/repo/$file\"; else rm -f \"/opt/olamide/repo/$file\"; fi\n  done\n}\nrecover() {\n  trap - ERR\n  restore_source\n  if test -f \"$backup_dir/rollback.yml\"; then\n    cd /opt/olamide/repo/deployment/docker\n    docker compose -f compose.yml -f \"$backup_dir/rollback.yml\" up -d --no-deps api </dev/null || true\n  fi\n  echo \"Billing deployment failed; restored prior source/images where available. Backup: $backup_dir\"\n  exit 1\n}\ntrap recover ERR\ngit show \"$release:tools/install-flowroute-markup.py\" > \"$backup_dir/install.py\"\npython3 \"$backup_dir/install.py\"\nfor file in services/api/flowrouteCustomerRate.js services/api/flowrouteCustomerRate.test.js services/api/flowrouteSettlement.test.js; do\n  git show \"$release:$file\" > \"$file\"\ndone\ncd deployment/docker\ndocker compose config --quiet </dev/null\nsuffix=$(date +%s)-$$\napi_id=$(docker inspect --format '{% raw %}{{.Image}}{% endraw %}' \"$(docker compose ps -q api)\")\ndocker tag \"$api_id\" \"olamide-api:before-markup-$suffix\"\nprintf 'services:\\n  api:\\n    image: olamide-api:before-markup-%s\\n' \"$suffix\" > \"$backup_dir/rollback.yml\"\ndocker compose build api </dev/null\ndocker compose run --rm --no-deps -T --entrypoint node api --test /app/flowrouteCustomerRate.test.js /app/flowrouteSettlement.test.js </dev/null\ndocker compose run --rm --no-deps -T --entrypoint node api --check /app/pstnBilling.js </dev/null\ndocker compose up -d --no-deps api </dev/null\ncurl -fsS --max-time 10 --retry 12 --retry-all-errors --retry-delay 3 https://sip.dobhrap.com/api/health\ntrap - ERR\necho \"Flowroute cost plus 30 percent deployed. Rate lookup uses active imported deck; wallet reservations and duration settlement retained. Backup: $backup_dir\"\n"
    args:
      executable: /bin/bash
    register: monitor_result
    changed_when: true
  - name: Show result
    ansible.builtin.debug:
      msg: '{{ monitor_result.stdout_lines[-20:] }}'
