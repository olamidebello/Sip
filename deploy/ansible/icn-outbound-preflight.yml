---
- name: Check ICN outbound activation prerequisites
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tasks:
    - name: Read server addresses
      ansible.builtin.command: hostname -I
      register: icn_addresses
      changed_when: false

    - name: Require SIP platform server
      ansible.builtin.assert:
        that:
          - "'154.29.77.102' in icn_addresses.stdout.split()"
        fail_msg: Run this playbook on SIP server 154.29.77.102.

    - name: Inspect deployed ICN implementation without exposing configuration
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            from pathlib import Path
            root=Path('/opt/olamide/repo')
            module=root/'services/api/icnOutbound.js'
            billing=root/'services/api/pstnBilling.js'
            cfg=Path('/etc/kamailio/kamailio.cfg')
            source=module.read_text() if module.is_file() else ''
            config=cfg.read_text() if cfg.is_file() else ''
            print(json.dumps({
              'icn_module_present': module.is_file(),
              'paid_billing_hook': billing.is_file() and 'ICN_OUTBOUND_PAID_V1' in billing.read_text(),
              'switch_peer_present': '196.216.253.173' in config,
              'activation_settings_present': Path('/var/lib/olamide/service-inventory/icn-outbound.json').is_file()
            }))
      register: icn_inspection
      changed_when: false

    - name: Show activation readiness
      ansible.builtin.debug:
        var: icn_inspection.stdout

    - name: Explain installed checks
      ansible.builtin.debug:
        msg: >-
          This check does not activate or test calls. Use
          deploy/ansible/icn-outbound-activate.yml with the reviewed activation
          settings to deploy paid ICN routing. True fields describe files and
          hooks only; carrier acceptance and two-way audio need a live test.

