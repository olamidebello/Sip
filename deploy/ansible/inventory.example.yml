all:
  children:
    switch_nodes:
      hosts:
        sip-switch-1:
          ansible_host: 192.0.2.10
          ansible_user: deploy
          kamailio_node_id: 00000000-0000-4000-8000-000000000001
      vars:
        kamailio_packages: [kamailio, kamailio-mysql-modules, kamailio-tls-modules, kamailio-websocket-modules, kamailio-presence-modules]
        kamailio_config_source: /srv/olamide/profiles/production/config
        kamailio_expected_modules: [kex, ctl, tm, sl, rr, auth, auth_db, sqlops, registrar, usrloc, db_mysql]
        kamailio_maintenance_approved: false
        kamailio_repo_path: /opt/olamide
