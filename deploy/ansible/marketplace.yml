---
- name: Prepare marketplace prerequisites on an existing SIP installation
  hosts: switch_nodes
  become: true
  tasks:
    - name: Require supported server
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Debian'
          - ansible_distribution_major_version == '12'
    - name: Install application deployment tools
      ansible.builtin.apt:
        name: [ca-certificates, git, python3, openssl, gzip, curl]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Require existing Docker Compose installation
      ansible.builtin.command:
        argv: [docker, compose, version]
      changed_when: false
    - name: Require production configuration
      ansible.builtin.stat:
        path: /etc/olamide/secrets.env
      register: marketplace_secrets
    - name: Require base SIP installation
      ansible.builtin.assert:
        that: marketplace_secrets.stat.exists
        fail_msg: 'For a new host run deployment/install-all.sh first. Existing database and production configuration are required.'
    - name: Ensure payment encryption key without rotating an existing key
      ansible.builtin.shell: |
        python3 - <<'PY'
        import os, re, secrets, tempfile
        path='/etc/olamide/secrets.env'
        with open(path) as f: content=f.read()
        values=re.findall(r'^PAYMENT_CONFIG_KEY=(.*)$',content,re.M)
        if len(values)>1: raise SystemExit('Duplicate PAYMENT_CONFIG_KEY entries; reconcile configuration first')
        if values and values[0].strip():
            if not re.fullmatch('[a-fA-F0-9]{64}',values[0].strip()): raise SystemExit('Invalid existing PAYMENT_CONFIG_KEY; do not rotate automatically')
            print('preserved')
        else:
            line='PAYMENT_CONFIG_KEY='+secrets.token_hex(32)
            updated=re.sub(r'^PAYMENT_CONFIG_KEY=.*$',line,content,flags=re.M) if values else content.rstrip()+'\n'+line+'\n'
            stat=os.stat(path)
            fd,tmp=tempfile.mkstemp(dir=os.path.dirname(path))
            try:
                os.fchmod(fd,0o600)
                os.fchown(fd,stat.st_uid,stat.st_gid)
                with os.fdopen(fd,'w') as f:
                    f.write(updated)
                    f.flush()
                    os.fsync(f.fileno())
                os.replace(tmp,path)
            finally:
                if os.path.exists(tmp): os.unlink(tmp)
            print('created')
        PY
      register: marketplace_key
      changed_when: "'created' in marketplace_key.stdout"
      no_log: true
- name: Build all API and web modules and apply registered database migrations
  ansible.builtin.import_playbook: messenger-features.yml
- name: Verify marketplace schema and deployment readiness
  hosts: switch_nodes
  become: true
  tasks:
    - name: Check marketplace schema and prerequisites without exposing credentials
      ansible.builtin.command:
        argv: [docker, compose, --env-file, /etc/olamide/secrets.env, exec, '-T', api, node, marketplaceReadiness.js]
        chdir: /opt/olamide/repo/deployment/docker
      register: marketplace_readiness
      changed_when: false
    - name: Report verified application status and outstanding commissioning
      ansible.builtin.debug:
        msg: '{{ marketplace_readiness.stdout_lines }}'
