---
- name: Deploy messaging and audio video call interface
  hosts: switch_nodes
  become: true
  vars:
    messaging_repo: /opt/olamide/repo
    messaging_domain: sip.dobhrap.com
  tasks:
    - name: Validate destination
      ansible.builtin.assert:
        that:
          - messaging_repo == '/opt/olamide/repo'
          - messaging_domain is match('^[a-zA-Z0-9.-]+$')
    - name: Reject tracked local changes
      ansible.builtin.command:
        argv: [git, diff, HEAD, --exit-code]
        chdir: '{{ messaging_repo }}'
      changed_when: false
    - name: Read the checked out release
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: '{{ messaging_repo }}'
      register: messaging_head
      changed_when: false
    - name: Fetch successful deployment validations
      ansible.builtin.uri:
        url: 'https://api.github.com/repos/olamidebello/Sip/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=100&head_sha={{ messaging_head.stdout }}&check={{ ansible_date_time.epoch }}'
        headers:
          Accept: application/vnd.github+json
          User-Agent: Olamide-GUI-deployer
          Cache-Control: no-cache
        return_content: true
        status_code: 200
        validate_certs: true
        timeout: 20
      register: messaging_ci
    - name: Require CI approval for this exact release
      ansible.builtin.assert:
        that:
          - messaging_head.stdout in (messaging_ci.json.workflow_runs | selectattr('conclusion', 'equalto', 'success') | map(attribute='head_sha') | list)
        fail_msg: 'This checked out commit has not passed deployment CI. Review GitHub Actions and rerun after success; no downgrade or unvalidated deployment was performed.'
    - name: Verify installed GUI release
      ansible.builtin.command:
        argv:
          - python3
          - '-c'
          - |
            from pathlib import Path
            import sys
            root=Path(sys.argv[1])
            chat=(root/'apps/web/src/chatLanding.js').read_text()
            assert 'chat-emoji-picker' in chat and 'chat-filters' in chat, 'Wait for GitHub CI validation of GUI release'
            assert (root/'apps/web/src/callGui.js').is_file(), 'Call GUI release missing'
          - '{{ messaging_repo }}'
      changed_when: false
    - name: Build web interface
      ansible.builtin.command:
        argv: [docker, compose, build, web]
        chdir: '{{ messaging_repo }}/deployment/docker'
      changed_when: true
    - name: Start web interface
      ansible.builtin.command:
        argv: [docker, compose, up, '-d', '--no-deps', web]
        chdir: '{{ messaging_repo }}/deployment/docker'
      changed_when: true
    - name: Verify public HTTPS routes
      ansible.builtin.uri:
        url: 'https://{{ messaging_domain }}{{ item }}'
        status_code: 200
        validate_certs: true
        timeout: 10
      loop: ['/', '/api/health']
      register: messaging_health
      until: messaging_health is succeeded
      retries: 6
      delay: 5
    - name: Report deployment
      ansible.builtin.debug:
        msg: 'GUI deployed. Verify messages and a SIP audio call with two accounts, then a video meeting using an invite. HTTPS health does not prove media connectivity.'
