---
- name: Validate optional native ASTPP release independently of production Kamailio
  hosts: switch_nodes
  become: true
  vars:
    messaging_repo: /opt/olamide/repo
    messaging_domain: sip.dobhrap.com
  tasks:
    - name: Validate destination
      ansible.builtin.assert:
        that:
          - messaging_repo == '/opt/olamide/repo'
          - messaging_domain is match('^[a-zA-Z0-9.-]+$')
    - name: Reject tracked local changes
      ansible.builtin.command:
        argv: [git, diff, HEAD, --exit-code]
        chdir: '{{ messaging_repo }}'
      changed_when: false
    - name: Read the checked out release
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: '{{ messaging_repo }}'
      register: messaging_head
      changed_when: false
    - name: Fetch successful deployment validations
      ansible.builtin.uri:
        url: 'https://api.github.com/repos/olamidebello/Sip/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=100&head_sha={{ messaging_head.stdout }}&check={{ ansible_date_time.epoch }}'
        headers:
          Accept: application/vnd.github+json
          User-Agent: Olamide-GUI-deployer
          Cache-Control: no-cache
        return_content: true
        status_code: 200
        validate_certs: true
        timeout: 20
      register: messaging_ci
    - name: Require CI approval for this exact release
      ansible.builtin.assert:
        that:
          - messaging_head.stdout in (messaging_ci.json.workflow_runs | selectattr('conclusion', 'equalto', 'success') | map(attribute='head_sha') | list)
        fail_msg: 'This checked out commit has not passed deployment CI. Review GitHub Actions and rerun after success; no downgrade or unvalidated deployment was performed.'
    - name: Verify existing production Kamailio before optional installation
      ansible.builtin.command:
        argv: [systemctl, is-active, kamailio]
      changed_when: false
- import_playbook: native-astpp-gui.yml
- name: Confirm optional services leave production Kamailio running
  hosts: switch_nodes
  become: true
  tasks:
    - name: Verify production Kamailio remains active
      ansible.builtin.command:
        argv: [systemctl, is-active, kamailio]
      changed_when: false
    - name: Report independent service scope
      ansible.builtin.debug:
        msg: Optional native ASTPP GUI and database installed privately. Production Kamailio configuration, routing and subscriber databases are unchanged. No additional SIP switch was installed. A native GUI failure must be repaired independently and is not a prerequisite for Kamailio deployment.
