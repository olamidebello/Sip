- name: Install supported Olamide integrations, database protection and requirement evidence
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    olamide_force_rebuild: false
    olamide_daily_backups: true
    olamide_install_release: 2ef4abf19ac65a3f14028e1a38245e3d7331290b
  tasks:
    - name: Validate supported host and explicit options
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
          - olamide_force_rebuild | type_debug == 'bool'
          - olamide_daily_backups | type_debug == 'bool'
          - olamide_install_release is match('^[a-f0-9]{40}$')
        fail_msg: 'This installer updates an existing Debian Olamide/Kamailio/MySQL deployment.'
    - name: Check existing deployment before installing packages
      ansible.builtin.stat:
        path: /opt/olamide/repo/deployment/docker/compose.yml
      register: olamide_compose
    - name: Require existing platform configuration
      ansible.builtin.assert:
        that: olamide_compose.stat.exists
        fail_msg: 'Existing production configuration is required; secrets and tenant ownership are never invented.'
    - name: Install host build and backup requirements
      ansible.builtin.apt:
        name: [git, curl, ca-certificates, python3, python3-yaml, gzip, tar, util-linux, coreutils]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Check installed Docker Compose and daemon
      ansible.builtin.shell: |
        set -euo pipefail
        docker compose version
        docker info --format '{% raw %}{{.ServerVersion}}{% endraw %}'
      args:
        executable: /bin/bash
      changed_when: false
    - name: Prepare private workflow directory
      ansible.builtin.tempfile:
        state: directory
        prefix: olamide-supported-
      register: olamide_work
    - name: Install and verify available implementations
      block:
        - name: Read pinned reviewed sources without replacing local customizations
          ansible.builtin.shell: |
            set -euo pipefail
            umask 077
            cd /opt/olamide/repo
            git fetch origin main </dev/null
            release='{{ olamide_install_release }}'
            git merge-base --is-ancestor "$release" origin/main
            for file in backup-platform.sh install-platform-supported.sh platform-install-report.mjs; do
              git show "$release:tools/$file" > "{{ olamide_work.path }}/$file"
            done
            for file in twilio-platform-local did-availability-local single-auth-local; do
              git show "$release:deploy/ansible/$file.yml" > "{{ olamide_work.path }}/$file.yml"
            done
          args:
            executable: /bin/bash
          changed_when: false
        - name: Back up database and deploy tested supported integration stages
          ansible.builtin.command:
            argv:
              - /bin/bash
              - '{{ olamide_work.path }}/install-platform-supported.sh'
              - '{{ olamide_work.path }}'
              - '{{ olamide_force_rebuild | ternary("true", "false") }}'
          register: olamide_result
        - name: Install reviewed private database backup command
          ansible.builtin.copy:
            src: '{{ olamide_work.path }}/backup-platform.sh'
            dest: /usr/local/sbin/olamide-platform-backup
            remote_src: true
            owner: root
            group: root
            mode: '0700'
        - name: Install bounded daily backup service
          ansible.builtin.copy:
            dest: /etc/systemd/system/olamide-platform-backup.service
            mode: '0644'
            content: |
              [Unit]
              Description=Private Olamide application database and source snapshot
              After=docker.service
              Requires=docker.service
              [Service]
              Type=oneshot
              UMask=0077
              ExecStart=/usr/local/sbin/olamide-platform-backup
              TimeoutStartSec=3600
        - name: Install daily backup timer
          ansible.builtin.copy:
            dest: /etc/systemd/system/olamide-platform-backup.timer
            mode: '0644'
            content: |
              [Unit]
              Description=Daily Olamide private backup
              [Timer]
              OnCalendar=*-*-* 03:20:00 UTC
              RandomizedDelaySec=900
              Persistent=true
              [Install]
              WantedBy=timers.target
        - name: Apply configured backup schedule
          ansible.builtin.systemd:
            name: olamide-platform-backup.timer
            daemon_reload: true
            enabled: '{{ olamide_daily_backups }}'
            state: '{{ olamide_daily_backups | ternary("started", "stopped") }}'
        - name: Show installation evidence and scope
          ansible.builtin.debug:
            msg: '{{ olamide_result.stdout_lines[-8:] }}'
      always:
        - name: Remove temporary reviewed sources
          ansible.builtin.file:
            path: '{{ olamide_work.path }}'
            state: absent
