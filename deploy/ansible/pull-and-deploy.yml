---
- name: Pull and deploy the existing SIP installation
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Install deployment prerequisites
      ansible.builtin.apt:
        name: [git, curl, ca-certificates, python3, util-linux, gzip, tar]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Check Docker Compose
      ansible.builtin.command: docker compose version
      changed_when: false
    - name: Ensure private backup directory exists
      ansible.builtin.file:
        path: /opt/olamide/backups
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Deploy with private diagnostics
      block:
        - name: Pull source, back up database, rebuild and verify SIP
          ansible.builtin.script: ../../deployment/pull-and-deploy.sh
          args:
            executable: /bin/bash
          register: sip_deploy
          changed_when: "'SIP_DEPLOYED' in sip_deploy.stdout"
          no_log: true
      rescue:
        - name: Show safe failure phase and private log location
          ansible.builtin.debug:
            msg: "{{ sip_deploy.stdout_lines | default([]) | select('match', '^SIP_DEPLOY_ERROR phase=[a-z_]+ log=/opt/olamide/backups/deploy-log-[A-Za-z0-9]+$') | list }}"
        - name: Report stopped deployment
          ansible.builtin.fail:
            msg: >-
              Deployment stopped. The safe phase above identifies the failed check;
              detailed output remains in the root-only log on the server.
              local_changes or diverged_history requires reconciling the server
              integrations before deployment. Do not reset or clean the live checkout.
    - name: Show deployment outcome
      ansible.builtin.debug:
        msg: "{{ sip_deploy.stdout_lines | select('match', '^SIP_DEPLOYED ') | list }}"
