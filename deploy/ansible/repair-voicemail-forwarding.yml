---
- name: Repair private voicemail destination forwarding
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Create private inbound configuration backup
      ansible.builtin.tempfile:
        state: directory
        path: /opt/olamide/backups
        prefix: voicemail-forward-
      register: inbound_contact_backup
    - name: Preserve live switch configuration
      ansible.builtin.copy:
        src: /etc/kamailio/kamailio.cfg
        dest: '{{ inbound_contact_backup.path }}/kamailio.cfg'
        remote_src: true
        mode: '0600'
      no_log: true
    - name: Stage private voicemail forwarding repair
      ansible.builtin.command:
        argv: [python3, '{{ playbook_dir }}/../../tools/prepare_voicemail_forwarding.py', /etc/kamailio/kamailio.cfg, '{{ inbound_contact_backup.path }}/staged.cfg']
      changed_when: true
    - name: Validate staged switch configuration
      ansible.builtin.command:
        argv: [kamailio, '-c', '-f', '{{ inbound_contact_backup.path }}/staged.cfg']
      no_log: true
      changed_when: false
    - name: Refuse concurrent configuration changes
      ansible.builtin.command:
        argv: [cmp, /etc/kamailio/kamailio.cfg, '{{ inbound_contact_backup.path }}/kamailio.cfg']
      changed_when: false
      no_log: true
    - name: Install and verify with switch rollback
      block:
        - name: Install validated voicemail forwarding repair
          ansible.builtin.copy:
            src: '{{ inbound_contact_backup.path }}/staged.cfg'
            dest: /etc/kamailio/kamailio.cfg
            remote_src: true
            owner: root
            group: kamailio
            mode: '0640'
        - name: Restart switch
          ansible.builtin.systemd:
            name: kamailio
            state: restarted
        - name: Restore commissioned carrier runtime
          ansible.builtin.command:
            argv: [python3, '-c', "import json,pathlib,subprocess; c=json.loads(pathlib.Path('/etc/olamide/carrier-adapter.json').read_text()); p=pathlib.Path(c['stateFile']); value=p.read_text() if p.exists() else ''; subprocess.run([c.get('kamcmd','/usr/sbin/kamcmd'),'-s',c['rpcSocket'],'htable.sets','olamide_carrier',c['tenantId'],value],check=True,capture_output=True)"]
          no_log: true
          changed_when: true
      rescue:
        - name: Restore previous switch configuration
          ansible.builtin.copy:
            src: '{{ inbound_contact_backup.path }}/kamailio.cfg'
            dest: /etc/kamailio/kamailio.cfg
            remote_src: true
            owner: root
            group: kamailio
            mode: '0640'
        - name: Restart restored switch
          ansible.builtin.systemd:
            name: kamailio
            state: restarted
        - name: Restore carrier runtime after rollback
          ansible.builtin.command:
            argv: [python3, '-c', "import json,pathlib,subprocess; c=json.loads(pathlib.Path('/etc/olamide/carrier-adapter.json').read_text()); p=pathlib.Path(c['stateFile']); value=p.read_text() if p.exists() else ''; subprocess.run([c.get('kamcmd','/usr/sbin/kamcmd'),'-s',c['rpcSocket'],'htable.sets','olamide_carrier',c['tenantId'],value],check=True,capture_output=True)"]
          no_log: true
          changed_when: true
        - name: Stop after unsuccessful installation
          ansible.builtin.fail:
            msg: Inbound patch failed; previous switch configuration restored.
    - name: Report called DID patch
      ansible.builtin.debug:
        msg: 'Voicemail branch clearing now precedes destination assignment. Authentication headers are stripped without consuming nonexistent carrier credentials. Carrier and owner checks remain. Receiving-device registration and a real call still require verification. Reconnect the user softphone after switch restart, then test the DID. Backup: {{ inbound_contact_backup.path }}'
