---
- name: Require two reviewed switch instances and explicit maintenance window
  ansible.builtin.assert:
    that:
      - freeswitch_instances | length == 2
      - freeswitch_maintenance_approved | bool
      - freeswitch_image is match('^[a-zA-Z0-9./:_-]+@sha256:[a-f0-9]{64}$')
- name: Validate instance topology before changing services
  ansible.builtin.command:
    argv: [python3, '-c', "import json,sys; x=json.loads(sys.argv[1]); assert [i['name'] for i in x]==['fs2','fs3']; assert [i['sip_port'] for i in x]==[5092,5093]; assert [i['esl_port'] for i in x]==[8092,8093]; assert [(i['rtp_min'],i['rtp_max']) for i in x]==[(40000,44999),(45000,49999)]", '{{ freeswitch_instances | to_json }}']
  changed_when: false
- name: Validate reviewed XML and reject exposed event sockets
  ansible.builtin.command:
    argv: [python3, '{{ kamailio_repo_path }}/tools/freeswitch_cluster_validate.py', '{{ item.config_source }}', '{{ item.sip_port }}', '{{ item.esl_port }}', '{{ item.rtp_min }}', '{{ item.rtp_max }}']
  loop: '{{ freeswitch_instances }}'
  changed_when: false
  no_log: true
- name: Pull immutable reviewed FreeSWITCH image
  ansible.builtin.command:
    argv: [docker, pull, '{{ freeswitch_image }}']
  changed_when: false
- name: Create private persistent instance directories
  ansible.builtin.file:
    path: '/opt/olamide/freeswitch/{{ item.name }}'
    state: directory
    mode: '0700'
  loop: '{{ freeswitch_instances }}'
- name: Install host network compose definition
  ansible.builtin.copy:
    dest: /opt/olamide/freeswitch/compose.yml
    mode: '0600'
    content: |
      services:
      {% for instance in freeswitch_instances %}
        {{ instance.name }}:
          image: {{ freeswitch_image }}
          network_mode: host
          restart: unless-stopped
          stop_grace_period: 120s
          volumes:
            - {{ instance.config_source }}:/usr/local/freeswitch/conf:ro
            - /opt/olamide/freeswitch/{{ instance.name }}:/usr/local/freeswitch/storage
          logging:
            driver: json-file
            options:
              max-size: 10m
              max-file: '3'
      {% endfor %}
- name: Start two isolated FreeSWITCH processes
  ansible.builtin.command:
    argv: [docker, compose, '-p', olamide-switches, '-f', /opt/olamide/freeswitch/compose.yml, up, '-d']
- name: Check authenticated local CLI on each switch
  ansible.builtin.command:
    argv: [docker, compose, '-p', olamide-switches, '-f', /opt/olamide/freeswitch/compose.yml, exec, '-T', '{{ item.name }}', /usr/local/freeswitch/bin/fs_cli, '-H', 127.0.0.1, '-P', '{{ item.esl_port | string }}', '-p', '{{ item.esl_password }}', '-x', status]
  loop: '{{ freeswitch_instances }}'
  register: freeswitch_health
  retries: 12
  delay: 5
  until: freeswitch_health.rc == 0 and 'UP' in freeswitch_health.stdout
  changed_when: false
  no_log: true
- name: Open only dedicated media ranges on public interface
  ansible.builtin.command:
    argv: [ufw, allow, in, on, '{{ sip_public_interface }}', to, '{{ sip_public_ip }}', port, '{{ item.rtp_min }}:{{ item.rtp_max }}', proto, udp]
  loop: '{{ freeswitch_instances }}'
- name: Record commissioned process health with traffic acceptance still pending
  ansible.builtin.copy:
    dest: /opt/olamide/freeswitch/status.json
    mode: '0600'
    content: '{{ {"instances": ["fs2", "fs3"], "processHealth": "tested", "routing": "pending", "callAcceptance": "pending", "highAvailability": "single-host"} | to_nice_json }}'
