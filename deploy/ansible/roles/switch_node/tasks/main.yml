---
- name: Validate platform and required configuration
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Debian'
      - ansible_distribution_major_version == '12'
      - freeswitch_signalwire_token | default('') | length > 0
      - freeswitch_xml_password | default('') | length >= 32
      - freeswitch_esl_password | default('') | length >= 32
      - freeswitch_domain is match('^[a-z0-9][a-z0-9.-]+[a-z0-9]$')
      - freeswitch_xml_url is match('^https://[^/]+/api/switch/xml$')
      - freeswitch_public_ip | default('') | length > 0
      - ansible_processor_vcpus | int >= 2
      - ansible_memtotal_mb | int >= 4096
      - freeswitch_wss_certificate_source | default('controller') in ['controller','caddy']
      - freeswitch_wss_certificate_source | default('controller') == 'caddy' or freeswitch_wss_certificate | default('') | length > 0
      - freeswitch_wss_certificate_source | default('controller') == 'caddy' or freeswitch_wss_key | default('') | length > 0
      - freeswitch_wss_certificate_source | default('controller') != 'caddy' or not (manage_firewall | default(false) | bool)
      - not (coturn_enabled | default(false) | bool) or (coturn_secret | default('') | length >= 32)
      - not (manage_firewall | default(false) | bool) or (freeswitch_ssh_allowed_cidrs | default([]) | length > 0)
    fail_msg: "Debian 12, a private API URL, certificate/key, and vaulted credentials are required."
  no_log: true

- name: Validate gateway names and SIP peers
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z][a-z0-9_-]{1,63}$')
      - item.proxy is match('^[a-zA-Z0-9.-]+(:[0-9]{2,5})?$')
      - item.username | default('') | length < 128
      - item.password | default('') | length < 256
  loop: "{{ freeswitch_gateways | default([]) }}"
  no_log: true

- name: Validate firewall allowlists
  ansible.builtin.assert:
    that:
      - item is match('^[0-9.]+/[0-9]{1,2}$')
  loop: "{{ (freeswitch_ssh_allowed_cidrs | default([])) + (freeswitch_carrier_allowed_cidrs | default([])) }}"
  when: manage_firewall | default(false) | bool

- name: Install apt prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, gnupg, python3, python3-apt, curl, openssl, logrotate, chrony]
    update_cache: true
    state: present

- name: Install nftables before opening switch services
  ansible.builtin.apt:
    name: nftables
    state: present
  when: manage_firewall | default(false) | bool

- name: Validate and apply switch firewall rules
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
    validate: 'nft -c -f %s'
  when: manage_firewall | default(false) | bool
  notify: Restart nftables

- name: Enable switch firewall before package installation
  ansible.builtin.service:
    name: nftables
    enabled: true
    state: started
  when: manage_firewall | default(false) | bool

- name: Apply firewall changes before package installation
  ansible.builtin.meta: flush_handlers

- name: Download authenticated SignalWire signing key
  ansible.builtin.get_url:
    url: https://freeswitch.signalwire.com/repo/deb/debian-release/signalwire-freeswitch-repo.gpg
    dest: /usr/share/keyrings/signalwire-freeswitch-repo.gpg
    owner: root
    group: root
    mode: '0644'
    url_username: signalwire
    url_password: "{{ freeswitch_signalwire_token }}"
    force_basic_auth: true
  no_log: true

- name: Store package repository credentials
  ansible.builtin.copy:
    dest: /etc/apt/auth.conf.d/freeswitch.conf
    content: "machine freeswitch.signalwire.com login signalwire password {{ freeswitch_signalwire_token }}\n"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Configure SignalWire stable repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/signalwire-freeswitch-repo.gpg] https://freeswitch.signalwire.com/repo/deb/debian-release/ bookworm main"
    filename: freeswitch
    state: present
    update_cache: true

- name: Check candidate FreeSWITCH package
  ansible.builtin.command: apt-cache policy freeswitch
  register: freeswitch_package_policy
  changed_when: false

- name: Require a stable package at or above the supported release
  ansible.builtin.assert:
    that:
      - "'Candidate:' in freeswitch_package_policy.stdout"
      - "'Candidate: (none)' not in freeswitch_package_policy.stdout"
    fail_msg: "The configured SignalWire stable repository has no FreeSWITCH candidate."

- name: Record candidate FreeSWITCH version
  ansible.builtin.set_fact:
    freeswitch_candidate_version: "{{ freeswitch_package_policy.stdout | regex_search('Candidate: ([^ ]+)', '\\1') | first }}"

- name: Compare candidate with minimum supported version
  ansible.builtin.command:
    argv:
      - dpkg
      - --compare-versions
      - "{{ freeswitch_candidate_version | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"
      - ge
      - "{{ freeswitch_minimum_version | default('1.11.3') }}"
  changed_when: false

- name: Check for an existing FreeSWITCH installation
  ansible.builtin.command: dpkg-query -W -f=${Version} freeswitch
  register: previous_freeswitch_package
  changed_when: false
  failed_when: false

- name: Determine whether a package upgrade is needed
  ansible.builtin.command:
    argv: [dpkg, --compare-versions, "{{ previous_freeswitch_package.stdout }}", lt, "{{ freeswitch_candidate_version }}"]
  register: freeswitch_upgrade_needed
  changed_when: false
  failed_when: false
  when:
    - previous_freeswitch_package.rc == 0
    - freeswitch_upgrade | default(true) | bool

- name: Check active calls before replacing an installed switch
  ansible.builtin.command:
    argv: [fs_cli, -H, 127.0.0.1, -P, '8021', -p, "{{ freeswitch_esl_password }}", -x, 'show calls count']
  register: active_calls
  changed_when: false
  no_log: true
  when:
    - previous_freeswitch_package.rc == 0
    - freeswitch_upgrade_needed.rc | default(1) == 0

- name: Refuse an upgrade while calls are active
  ansible.builtin.assert:
    that:
      - active_calls.stdout is match('^\\s*0 total')
    fail_msg: "Active calls remain. Drain this node before upgrading FreeSWITCH."
  when:
    - previous_freeswitch_package.rc == 0
    - freeswitch_upgrade_needed.rc | default(1) == 0

- name: Create switch backup directory
  ansible.builtin.file:
    path: /var/backups/olamide-switch
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: previous_freeswitch_package.rc == 0

- name: Back up switch configuration before upgrade
  ansible.builtin.command:
    argv:
      - tar
      - -C
      - /etc
      - -czf
      - "/var/backups/olamide-switch/freeswitch-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
      - freeswitch
  when:
    - previous_freeswitch_package.rc == 0
    - freeswitch_upgrade_needed.rc | default(1) == 0
  changed_when: true

- name: Record previous package version for rollback
  ansible.builtin.copy:
    dest: "/var/backups/olamide-switch/freeswitch-{{ ansible_date_time.iso8601_basic_short }}.version"
    content: "{{ previous_freeswitch_package.stdout }}\n"
    owner: root
    group: root
    mode: '0600'
  when:
    - previous_freeswitch_package.rc == 0
    - freeswitch_upgrade_needed.rc | default(1) == 0

- name: Install FreeSWITCH and XML curl
  ansible.builtin.apt:
    name:
      - freeswitch-meta-vanilla
      - freeswitch-mod-xml-curl
    state: "{{ 'latest' if freeswitch_upgrade | default(true) | bool else 'present' }}"

- name: Check optional sound packages in the authenticated repository
  ansible.builtin.command:
    argv: [apt-cache, policy, "{{ item }}"]
  loop:
    - freeswitch-sounds-en-us-callie
    - freeswitch-sounds-music
  register: freeswitch_sound_policy
  changed_when: false

- name: Install available FreeSWITCH sound packages
  ansible.builtin.apt:
    name: "{{ item.item }}"
    state: "{{ 'latest' if freeswitch_upgrade | default(true) | bool else 'present' }}"
  loop: "{{ freeswitch_sound_policy.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'Candidate: (none)' not in item.stdout and 'Candidate:' in item.stdout"

- name: Read installed FreeSWITCH package version
  ansible.builtin.command: dpkg-query -W -f=${Version} freeswitch
  register: installed_freeswitch_package
  changed_when: false

- name: Require installed version at or above minimum
  ansible.builtin.command:
    argv: [dpkg, --compare-versions, "{{ installed_freeswitch_package.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}", ge, "{{ freeswitch_minimum_version | default('1.11.3') }}"]
  changed_when: false

- name: Install local node telemetry exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present

- name: Restrict node exporter to loopback
  ansible.builtin.lineinfile:
    path: /etc/default/prometheus-node-exporter
    regexp: '^ARGS='
    line: 'ARGS="--web.listen-address=127.0.0.1:9100"'
  notify: Restart node exporter

- name: Enable time synchronization and local telemetry
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [chrony, prometheus-node-exporter]

- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/freeswitch.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Set FreeSWITCH file descriptor capacity
  ansible.builtin.copy:
    dest: /etc/systemd/system/freeswitch.service.d/olamide.conf
    content: "[Service]\nLimitNOFILE=65536\nRestart=on-failure\nRestartSec=5s\n"
    owner: root
    group: root
    mode: '0644'
  notify: Restart FreeSWITCH

- name: Reload systemd unit definitions
  ansible.builtin.systemd:
    daemon_reload: true

- name: Create TLS directory
  ansible.builtin.file:
    path: /etc/freeswitch/tls
    state: directory
    owner: freeswitch
    group: freeswitch
    mode: '0750'

- name: Install trusted WSS certificate
  ansible.builtin.copy:
    src: "{{ freeswitch_wss_certificate }}"
    dest: /etc/freeswitch/tls/wss.crt
    owner: freeswitch
    group: freeswitch
    mode: '0640'
  notify: Restart FreeSWITCH
  when: freeswitch_wss_certificate_source | default('controller') == 'controller'

- name: Install WSS private key
  ansible.builtin.copy:
    src: "{{ freeswitch_wss_key }}"
    dest: /etc/freeswitch/tls/wss.key
    owner: freeswitch
    group: freeswitch
    mode: '0600'
  no_log: true
  notify: Restart FreeSWITCH
  when: freeswitch_wss_certificate_source | default('controller') == 'controller'

- name: Locate Caddy certificate volume
  ansible.builtin.command:
    argv: [docker, volume, inspect, "{{ freeswitch_caddy_volume | default('docker_caddy_data') }}"]
  register: caddy_volume
  changed_when: false
  when: freeswitch_wss_certificate_source | default('controller') == 'caddy'

- name: Discover Caddy TLS certificate and key
  ansible.builtin.find:
    paths: "{{ (caddy_volume.stdout | from_json | first).Mountpoint }}/caddy/certificates"
    patterns: "{{ freeswitch_domain }}.{{ item }}"
    recurse: true
    file_type: file
  loop: [crt, key]
  register: caddy_tls_files
  when: freeswitch_wss_certificate_source | default('controller') == 'caddy'

- name: Require a trusted Caddy certificate and key
  ansible.builtin.assert:
    that:
      - caddy_tls_files.results[0].matched | int > 0
      - caddy_tls_files.results[1].matched | int > 0
    fail_msg: "Caddy has not issued a certificate for the SIP domain."
  when: freeswitch_wss_certificate_source | default('controller') == 'caddy'

- name: Install Caddy certificate for WSS
  ansible.builtin.copy:
    src: "{{ caddy_tls_files.results[0].files[0].path }}"
    remote_src: true
    dest: /etc/freeswitch/tls/wss.crt
    owner: freeswitch
    group: freeswitch
    mode: '0640'
  when: freeswitch_wss_certificate_source | default('controller') == 'caddy'
  notify: Restart FreeSWITCH

- name: Install Caddy private key for WSS
  ansible.builtin.copy:
    src: "{{ caddy_tls_files.results[1].files[0].path }}"
    remote_src: true
    dest: /etc/freeswitch/tls/wss.key
    owner: freeswitch
    group: freeswitch
    mode: '0600'
  no_log: true
  when: freeswitch_wss_certificate_source | default('controller') == 'caddy'
  notify: Restart FreeSWITCH

- name: Install WSS certificate renewal sync
  ansible.builtin.template:
    src: sync-caddy-wss.sh.j2
    dest: /usr/local/sbin/olamide-sync-wss
    owner: root
    group: root
    mode: '0700'
  no_log: true
  when: freeswitch_wss_certificate_source | default('controller') == 'caddy'

- name: Install WSS certificate sync units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/olamide-wss-sync.{{ item.suffix }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - suffix: service
      content: |
        [Unit]
        Description=Sync Caddy certificate to FreeSWITCH WSS
        After=docker.service freeswitch.service
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/olamide-sync-wss
    - suffix: timer
      content: |
        [Unit]
        Description=Check FreeSWITCH WSS certificate renewal
        [Timer]
        OnBootSec=15min
        OnUnitActiveSec=6h
        Persistent=true
        [Install]
        WantedBy=timers.target
  when: freeswitch_wss_certificate_source | default('controller') == 'caddy'

- name: Enable WSS certificate sync timer
  ansible.builtin.systemd:
    name: olamide-wss-sync.timer
    daemon_reload: true
    enabled: true
    state: started
  when: freeswitch_wss_certificate_source | default('controller') == 'caddy'

- name: Enable XML curl module
  ansible.builtin.lineinfile:
    path: /etc/freeswitch/autoload_configs/modules.conf.xml
    insertbefore: '</modules>'
    line: '    <load module="mod_xml_curl"/>'
    state: present
  notify: Restart FreeSWITCH

- name: Configure authenticated directory and dialplan lookup
  ansible.builtin.template:
    src: xml_curl.conf.xml.j2
    dest: /etc/freeswitch/autoload_configs/xml_curl.conf.xml
    owner: freeswitch
    group: freeswitch
    mode: '0600'
  no_log: true
  notify: Restart FreeSWITCH

- name: Lock event socket to loopback
  ansible.builtin.template:
    src: event_socket.conf.xml.j2
    dest: /etc/freeswitch/autoload_configs/event_socket.conf.xml
    owner: freeswitch
    group: freeswitch
    mode: '0600'
  no_log: true
  notify: Restart FreeSWITCH

- name: Configure public SIP and RTP addresses
  ansible.builtin.lineinfile:
    path: /etc/freeswitch/vars.xml
    regexp: '^  <X-PRE-PROCESS cmd="set" data="{{ item.name }}=.*"/>$'
    line: '  <X-PRE-PROCESS cmd="set" data="{{ item.name }}={{ item.value }}"/>'
    insertbefore: '</include>'
  loop:
    - {name: external_sip_ip, value: "{{ freeswitch_public_ip }}"}
    - {name: external_rtp_ip, value: "{{ freeswitch_public_ip }}"}
    - {name: domain, value: "{{ freeswitch_domain }}"}
  notify: Restart FreeSWITCH

- name: Configure per-carrier Sofia gateways
  ansible.builtin.template:
    src: gateway.xml.j2
    dest: "/etc/freeswitch/sip_profiles/external/olamide-{{ item.name }}.xml"
    owner: freeswitch
    group: freeswitch
    mode: '0600'
  loop: "{{ freeswitch_gateways | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart FreeSWITCH

- name: Install TURN relay
  ansible.builtin.apt:
    name: coturn
    state: present
  when: coturn_enabled | default(false) | bool

- name: Enable TURN daemon
  ansible.builtin.lineinfile:
    path: /etc/default/coturn
    regexp: '^#?TURNSERVER_ENABLED='
    line: 'TURNSERVER_ENABLED=1'
  when: coturn_enabled | default(false) | bool
  notify: Restart coturn

- name: Configure TURN short-lived secret authentication
  ansible.builtin.template:
    src: turnserver.conf.j2
    dest: /etc/turnserver.conf
    owner: root
    group: turnserver
    mode: '0640'
  when: coturn_enabled | default(false) | bool
  no_log: true
  notify: Restart coturn

- name: Enable and start FreeSWITCH
  ansible.builtin.service:
    name: freeswitch
    enabled: true
    state: started

- name: Enable and start TURN
  ansible.builtin.service:
    name: coturn
    enabled: true
    state: started
  when: coturn_enabled | default(false) | bool

- name: Apply pending service changes
  ansible.builtin.meta: flush_handlers

- name: Verify FreeSWITCH is active
  ansible.builtin.command: systemctl is-active freeswitch
  changed_when: false
  when: not ansible_check_mode

- name: Verify local event socket responds
  ansible.builtin.command:
    argv: [fs_cli, -H, 127.0.0.1, -P, '8021', -p, "{{ freeswitch_esl_password }}", -x, status]
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Read running FreeSWITCH version
  ansible.builtin.command:
    argv: [fs_cli, -H, 127.0.0.1, -P, '8021', -p, "{{ freeswitch_esl_password }}", -x, 'version short']
  register: running_freeswitch_version
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Require running FreeSWITCH version at or above minimum
  ansible.builtin.command:
    argv:
      - dpkg
      - --compare-versions
      - "{{ running_freeswitch_version.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"
      - ge
      - "{{ freeswitch_minimum_version | default('1.11.3') }}"
  changed_when: false
  when: not ansible_check_mode

- name: Verify authenticated XML lookup reaches the API
  ansible.builtin.uri:
    url: "{{ freeswitch_xml_url }}"
    method: POST
    user: olamide
    password: "{{ freeswitch_xml_password }}"
    force_basic_auth: true
    body_format: form-urlencoded
    body:
      section: directory
      domain: "{{ freeswitch_domain }}"
      user: healthcheck
    status_code: 200
    return_content: true
  register: xml_health
  no_log: true
  changed_when: false
  when: not ansible_check_mode

- name: Verify XML document was returned
  ansible.builtin.assert:
    that:
      - "'freeswitch/xml' in xml_health.content"
  when: not ansible_check_mode
