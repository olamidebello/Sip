---
- name: Publish SMS conversation list and message threads
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Patch recognized sources and deploy with private backups and rollback
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        exec 9>/run/olamide-update.lock
        flock -n 9 || { echo 'Another deployment is running'; exit 1; }
        cd /opt/olamide/repo
        backup=$(mktemp -d /opt/olamide/backups/sms-threads-XXXXXXXX)
        exec > "$backup/deploy.log" 2>&1
        files=(apps/web/src/main.js apps/web/src/smsConversations.js apps/web/src/smsConversations.css)
        for f in "${files[@]}"; do
          test ! -L "$f"
          mkdir -p "$backup/source/$(dirname "$f")"
          if test -f "$f"; then cp -p "$f" "$backup/source/$f"; fi
        done
        cd deployment/docker
        printf 'services:\n' > "$backup/rollback.yml"
        for service in web; do
          cid=$(docker compose ps -q "$service")
          test -n "$cid"
          image=$(docker inspect --format '{% raw %}{{.Image}}{% endraw %}' "$cid")
          tag="olamide-$service:before-$(basename "$backup")"
          docker tag "$image" "$tag"
          printf '  %s:\n    image: %s\n' "$service" "$tag" >> "$backup/rollback.yml"
        done
        cd ../..
        promoted=0
        rollback() {
          trap - ERR
          for f in "${files[@]}"; do
            if test -f "$backup/source/$f"; then cp -p "$backup/source/$f" "$f"; else rm -f "$f"; fi
          done
          if test "$promoted" = 1; then
            cd /opt/olamide/repo/deployment/docker
            docker compose -f compose.yml -f "$backup/rollback.yml" up -d --no-deps web || true
          fi
          exit 1
        }
        trap rollback ERR
        python3 '{{ playbook_dir }}/../../tools/apply_sms_conversations.py' /opt/olamide/repo
        cd deployment/docker
        docker compose build web
        docker compose run --rm --no-deps -T --entrypoint caddy web validate --config /etc/caddy/Caddyfile --adapter caddyfile
        promoted=1
        docker compose up -d --no-deps web
        curl -fsS --max-time 10 --retry 12 --retry-all-errors --retry-delay 3 https://sip.dobhrap.com/api/health
        trap - ERR
      args:
        executable: /bin/bash
      no_log: true
      changed_when: true
    - name: Report SMS conversation update
      ansible.builtin.debug:
        msg: 'SMS conversation list and message threads installed. Refresh or reopen the app.'
