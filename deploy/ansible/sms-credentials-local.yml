- name: Repair outbound SMS to use saved Flowroute credentials
  hosts: all
  become: true
  gather_facts: false
  tasks:
  - name: Preserve local fixes, test SMS credentials and verify carrier authentication
    ansible.builtin.shell: "set -euo pipefail\numask 077\ncd /opt/olamide/repo\nexec\
      \ 9>/run/olamide-update.lock\nflock -n 9 || { echo 'Another deployment is running';\
      \ exit 1; }\nbackup_dir=\"/opt/olamide/backups/sms-credentials-$(date -u +%Y%m%dT%H%M%S)-$$\"\
      \ninstall -d -m 0700 \"$backup_dir\"\ngit fetch origin main </dev/null\nrelease=d86cb1ba928f1ebaeac1d6f346ea0f9720135c03\n\
      git merge-base --is-ancestor \"$release\" origin/main\nfiles=(services/api/messagingWebhooks.js\
      \ services/api/smsCredentials.js services/api/smsCredentials.test.js)\nfor file\
      \ in \"${files[@]}\"; do\n mkdir -p \"$backup_dir/source/$(dirname \"$file\"\
      )\"\n if test -f \"$file\"; then cp -p \"$file\" \"$backup_dir/source/$file\"\
      ; fi\ndone\nrecover() {\n trap - ERR\n for file in \"${files[@]}\"; do\n  if\
      \ test -f \"$backup_dir/source/$file\"; then cp -p \"$backup_dir/source/$file\"\
      \ \"/opt/olamide/repo/$file\"; else rm -f \"/opt/olamide/repo/$file\"; fi\n\
      \ done\n if test -f \"$backup_dir/rollback.yml\"; then\n  cd /opt/olamide/repo/deployment/docker\n\
      \  docker compose -f compose.yml -f \"$backup_dir/rollback.yml\" up -d --no-deps\
      \ api </dev/null || true\n fi\n echo \"SMS credential repair stopped; prior\
      \ source/image restored where available. Backup: $backup_dir\"\n exit 1\n}\n\
      trap recover ERR\ngit show \"$release:tools/repair-sms-credentials.py\" > \"\
      $backup_dir/install.py\"\npython3 \"$backup_dir/install.py\"\nfor file in services/api/smsCredentials.js\
      \ services/api/smsCredentials.test.js; do git show \"$release:$file\" > \"$file\"\
      ; done\ncd deployment/docker\ndocker compose config --quiet </dev/null\nsuffix=$(date\
      \ +%s)-$$\napi_id=$(docker inspect --format '{% raw %}{{.Image}}{% endraw %}'\
      \ \"$(docker compose ps -q api)\")\ndocker tag \"$api_id\" \"olamide-api:before-sms-credentials-$suffix\"\
      \nprintf 'services:\\n  api:\\n    image: olamide-api:before-sms-credentials-%s\\\
      n' \"$suffix\" > \"$backup_dir/rollback.yml\"\ndocker compose build api </dev/null\n\
      docker compose run --rm --no-deps -T --entrypoint node api --test /app/smsCredentials.test.js\
      \ </dev/null\ndocker compose run --rm --no-deps -T --entrypoint node api --check\
      \ /app/messagingWebhooks.js </dev/null\ndocker compose up -d --no-deps api </dev/null\n\
      curl -fsS --max-time 10 --retry 12 --retry-all-errors --retry-delay 3 https://sip.dobhrap.com/api/health\n\
      docker compose exec -T api node --input-type=module <<'JS'\nimport {createDatabase}\
      \ from './db.js';\nimport {smsCredentials} from './smsCredentials.js';\nconst\
      \ db=createDatabase(process.env.MYSQL_URL);\ntry{\n const tenants=(await db.query('SELECT\
      \ DISTINCT tenant_id FROM flowroute_sms_numbers WHERE enabled=TRUE')).rows;\n\
      \ for(const t of tenants){\n  const c=await smsCredentials(db,t.tenant_id);\n\
      \  const url=new URL('https://api.flowroute.com/v2.2/messages');\n  url.searchParams.set('start_date',new\
      \ Date(Date.now()-86400000).toISOString());url.searchParams.set('limit','1');\n\
      \  const r=await fetch(url,{headers:{Authorization:'Basic '+Buffer.from(c.accessKey+':'+c.secretKey).toString('base64'),Accept:'application/vnd.api+json'},signal:AbortSignal.timeout(15000)});\n\
      \  console.log('Saved-credential Flowroute lookup HTTP:',r.status);\n  await\
      \ r.body?.cancel();\n  if(r.status!==200)throw Error('Carrier authentication\
      \ check did not pass');\n }\n}catch(e){console.error('Carrier check failed:',e.cause?.code||e.code||e.name);process.exitCode=1;}\n\
      finally{await db.end();}\nJS\ntrap - ERR\necho \"SMS credential repair installed.\
      \ Send one NEW test SMS; old unknown messages were not resent. Backup: $backup_dir\"\
      \n"
    args:
      executable: /bin/bash
    register: repair_result
    changed_when: true
  - name: Show SMS repair result
    ansible.builtin.debug:
      msg: '{{ repair_result.stdout_lines[-18:] }}'
