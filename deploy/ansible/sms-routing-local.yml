- name: Deploy outbound SMS routes and inbound SMS email forwarding controls
  hosts: all
  become: true
  gather_facts: false
  tasks:
  - name: Back up, integrate, test and deploy SMS controls
    ansible.builtin.shell: "set -euo pipefail\numask 077\ncd /opt/olamide/repo\nexec\
      \ 9>/run/olamide-update.lock\nflock -n 9 || { echo 'Another deployment is running';\
      \ exit 1; }\nbackup_dir=\"/opt/olamide/backups/sms-routing-$(date -u +%Y%m%dT%H%M%S)-$$\"\
      \ninstall -d -m 0700 \"$backup_dir\"\ngit fetch origin main </dev/null\nrelease=c13838b3840a19c4b93b8abe5998f6d11e57ab7c\n\
      git merge-base --is-ancestor \"$release\" origin/main\nfiles=(services/api/server.js\
      \ apps/web/src/main.js services/api/smsRouteControl.js services/api/smsRouteControl.test.js\
      \ apps/web/src/smsRouteControlUi.js apps/web/src/smsRouteControlUi.test.js deployment/docker/compose.yml\
      \ deployment/docker/.env)\nfor file in \"${files[@]}\"; do\n mkdir -p \"$backup_dir/source/$(dirname\
      \ \"$file\")\"\n if test -f \"$file\"; then cp -p \"$file\" \"$backup_dir/source/$file\"\
      ; fi\ndone\nrecover() {\n trap - ERR\n for file in \"${files[@]}\"; do\n  if\
      \ test -f \"$backup_dir/source/$file\"; then cp -p \"$backup_dir/source/$file\"\
      \ \"/opt/olamide/repo/$file\"; else rm -f \"/opt/olamide/repo/$file\"; fi\n\
      \ done\n if test -f \"$backup_dir/rollback.yml\"; then\n  cd /opt/olamide/repo/deployment/docker\n\
      \  docker compose -f compose.yml -f \"$backup_dir/rollback.yml\" up -d --no-deps\
      \ api web </dev/null || true\n fi\n echo \"SMS routing deployment stopped; prior\
      \ source/images restored where available. Backup: $backup_dir\"\n exit 1\n}\n\
      trap recover ERR\ngit show \"$release:tools/install-sms-route-control.py\" >\
      \ \"$backup_dir/install.py\"\npython3 -c \"import yaml\"\npython3 \"$backup_dir/install.py\"\
      \nfor file in services/api/smsRouteControl.js services/api/smsRouteControl.test.js\
      \ apps/web/src/smsRouteControlUi.js apps/web/src/smsRouteControlUi.test.js;\
      \ do git show \"$release:$file\" > \"$file\"; done\ncd deployment/docker\ndocker\
      \ compose config --quiet </dev/null\nsuffix=$(date +%s)-$$\napi_id=$(docker\
      \ inspect --format '{% raw %}{{.Image}}{% endraw %}' \"$(docker compose ps -q\
      \ api)\")\nweb_id=$(docker inspect --format '{% raw %}{{.Image}}{% endraw %}'\
      \ \"$(docker compose ps -q web)\")\ndocker tag \"$api_id\" \"olamide-api:before-sms-routing-$suffix\"\
      \ndocker tag \"$web_id\" \"olamide-web:before-sms-routing-$suffix\"\nprintf\
      \ 'services:\\n  api:\\n    image: olamide-api:before-sms-routing-%s\\n  web:\\\
      n    image: olamide-web:before-sms-routing-%s\\n' \"$suffix\" \"$suffix\" >\
      \ \"$backup_dir/rollback.yml\"\ndocker compose build api </dev/null\ndocker\
      \ compose run --rm --no-deps -T --entrypoint node api --test /app/smsRouteControl.test.js\
      \ </dev/null\nfor file in server.js smsRouteControl.js; do docker compose run\
      \ --rm --no-deps -T --entrypoint node api --check \"/app/$file\" </dev/null;\
      \ done\ncd ../..\ndocker build -f deployment/docker/web.Dockerfile --target\
      \ build -t olamide-sms-ui-check . </dev/null\ndocker run --rm --entrypoint node\
      \ olamide-sms-ui-check --test /app/src/smsRouteControlUi.test.js </dev/null\n\
      cd deployment/docker\ndocker compose build web </dev/null\ndocker compose up\
      \ -d --no-deps api web </dev/null\ncurl -fsS --max-time 10 --retry 12 --retry-all-errors\
      \ --retry-delay 3 https://sip.dobhrap.com/api/health\ntrap - ERR\necho \"SMS\
      \ controls deployed: Administrator > Outbound SMS & email forwarding. Email\
      \ provider credentials and verified recipient email required. Existing carrier\
      \ authorization and daily caps retained. Backup: $backup_dir\"\n"
    args:
      executable: /bin/bash
    register: sms_result
    changed_when: true
  - name: Show SMS controls deployment
    ansible.builtin.debug:
      msg: '{{ sms_result.stdout_lines[-16:] }}'
