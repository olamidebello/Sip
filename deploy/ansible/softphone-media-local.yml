- name: Connect SIP calling to existing authenticated TURN relays
  hosts: all
  become: true
  gather_facts: false
  tasks:
  - name: Back up, integrate, test and deploy monitoring
    ansible.builtin.shell: "set -euo pipefail\numask 077\ncd /opt/olamide/repo\nexec 9>/run/olamide-update.lock\nflock -n 9 || { echo 'Another deployment is running'; exit 1; }\nbackup_dir=\"/opt/olamide/backups/softphone-media-$(date -u +%Y%m%dT%H%M%S)-$$\"\ninstall -d -m 0700 \"$backup_dir\"\ngit fetch origin main </dev/null\nrelease=b6a7141f02f1e7f15119545e9817d0daff2b81f5\ngit merge-base --is-ancestor \"$release\" origin/main\nfiles=(services/api/server.js apps/web/src/main.js apps/web/src/softphoneMedia.js apps/web/src/softphoneMedia.test.js)\nfor file in \"${files[@]}\"; do\n  mkdir -p \"$backup_dir/$(dirname \"$file\")\"\n  if test -f \"$file\"; then cp -p \"$file\" \"$backup_dir/$file\"; fi\ndone\nrestore_source() {\n  for file in \"${files[@]}\"; do\n    if test -f \"$backup_dir/$file\"; then cp -p \"$backup_dir/$file\" \"/opt/olamide/repo/$file\"; else rm -f \"/opt/olamide/repo/$file\"; fi\n  done\n}\nrecover() {\n  trap - ERR\n  restore_source\n  if test -f \"$backup_dir/rollback.yml\"; then\n    cd /opt/olamide/repo/deployment/docker\n    docker compose -f compose.yml -f \"$backup_dir/rollback.yml\" up -d --no-deps api web </dev/null || true\n  fi\n  echo \"Monitoring deployment failed; restored prior source/images where available. Backup: $backup_dir\"\n  exit 1\n}\ntrap recover ERR\ngit show \"$release:tools/install-softphone-media.py\" > \"$backup_dir/install.py\"\npython3 \"$backup_dir/install.py\"\nfor file in apps/web/src/softphoneMedia.js apps/web/src/softphoneMedia.test.js; do\n  git show \"$release:$file\" > \"$file\"\ndone\ncd deployment/docker\ndocker compose config --quiet </dev/null\nsuffix=$(date +%s)-$$\napi_id=$(docker inspect --format '{% raw %}{{.Image}}{% endraw %}' \"$(docker compose ps -q api)\")\nweb_id=$(docker inspect --format '{% raw %}{{.Image}}{% endraw %}' \"$(docker compose ps -q web)\")\ndocker tag \"$api_id\" \"olamide-api:before-media-$suffix\"\ndocker tag \"$web_id\" \"olamide-web:before-media-$suffix\"\nprintf 'services:\\n  api:\\n    image: olamide-api:before-media-%s\\n  web:\\n    image: olamide-web:before-media-%s\\n' \"$suffix\" \"$suffix\" > \"$backup_dir/rollback.yml\"\ndocker compose build api web </dev/null\npython3 - \"$backup_dir/media-check.mjs\" <<'PYTEST'\nimport sys\nfrom pathlib import Path\nbase=Path('../../apps/web/src')\nhelper=(base/'softphoneMedia.js').read_text()\ntest=(base/'softphoneMedia.test.js').read_text().replace(\"import {softphoneMediaOptions} from './softphoneMedia.js';\",'')\nPath(sys.argv[1]).write_text(helper+'\\n'+test)\nPYTEST\ndocker compose run --rm --no-deps -T --entrypoint node api --input-type=module < \"$backup_dir/media-check.mjs\"\ndocker compose run --rm --no-deps -T --entrypoint node api --check /app/server.js </dev/null\ndocker compose up -d --no-deps api web </dev/null\ncurl -fsS --max-time 10 --retry 12 --retry-all-errors --retry-delay 3 https://sip.dobhrap.com/api/health\ndocker compose exec -T api node -e 'console.log(\"TURN credentials configured:\",Boolean(process.env.TURN_SECRET && process.env.TURN_PUBLIC_HOST))' </dev/null\ndocker compose ps -a turn\ntrap - ERR\necho \"SIP media integration deployed. TURN must be configured and reachable; test two-way audio from Nigeria. Backup: $backup_dir\"\n"
    args:
      executable: /bin/bash
    register: monitor_result
    changed_when: true
  - name: Show result
    ansible.builtin.debug:
      msg: '{{ monitor_result.stdout_lines[-20:] }}'
