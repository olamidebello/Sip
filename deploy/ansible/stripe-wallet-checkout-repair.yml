---
- name: Repair Stripe wallet checkout compatibility
  hosts: switch_nodes
  become: true
  gather_facts: false
  vars:
    stripe_repair_repo: /opt/olamide/repo
    stripe_repair_compose: '{{ stripe_repair_repo }}/deployment/docker'
    stripe_repair_source: '{{ stripe_repair_repo }}/services/api/walletFunding.js'
    stripe_repair_card_parameter: "'payment_method_types[0]':'card',"
    stripe_repair_probe: >-
      import fs from 'node:fs';
      const s=fs.readFileSync('/app/walletFunding.js','utf8');
      if(s.includes('payment_method_types'))process.exit(1);
      console.log('Stripe wallet checkout repair verified');
  tasks:
    - name: Find installed production overrides
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '{{ stripe_repair_compose }}/compose.callerids.yml'
        - /etc/olamide/compose.location.yml
        - /etc/olamide/compose.countries.yml
      register: stripe_repair_overrides

    - name: Preserve production Compose files and environment
      ansible.builtin.set_fact:
        stripe_repair_command: >-
          {{ ['docker', 'compose', '-p', 'docker', '--env-file', stripe_repair_compose + '/.env', '-f', stripe_repair_compose + '/compose.yml'] }}

    - name: Append installed overrides
      ansible.builtin.set_fact:
        stripe_repair_command: '{{ stripe_repair_command + ["-f", item.item] }}'
      loop: '{{ stripe_repair_overrides.results }}'
      when: item.stat.exists

    - name: Check external country resource before deployment
      ansible.builtin.stat:
        path: /etc/olamide/country-resources/countries.geojson
      register: stripe_repair_country_resource

    - name: Require installed country resource when country override exists
      ansible.builtin.assert:
        that:
          - stripe_repair_country_resource.stat.exists
          - stripe_repair_country_resource.stat.size | default(0) > 0
        fail_msg: Restore the country boundary resource before rebuilding the API.
      when: stripe_repair_overrides.results[2].stat.exists

    - name: Read existing wallet funding source
      ansible.builtin.slurp:
        src: '{{ stripe_repair_source }}'
      register: stripe_repair_original

    - name: Refuse unknown payment method configurations
      ansible.builtin.assert:
        that:
          - "'payment_method_types' not in ((stripe_repair_original.content | b64decode) | replace(stripe_repair_card_parameter, ''))"
        fail_msg: Unrecognized payment method configuration; source was not changed.

    - name: Remove unsupported explicit card parameter with backup
      ansible.builtin.replace:
        path: '{{ stripe_repair_source }}'
        regexp: '{{ stripe_repair_card_parameter | regex_escape }}'
        replace: ''
        backup: true
      register: stripe_repair_patch

    - name: Inspect current API container
      ansible.builtin.command:
        argv: '{{ stripe_repair_command + ["exec", "-T", "api", "node", "--input-type=module", "-e", stripe_repair_probe] }}'
        chdir: '{{ stripe_repair_compose }}'
      register: stripe_repair_runtime
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Build repaired API image
      ansible.builtin.command:
        argv: '{{ stripe_repair_command + ["build", "api"] }}' 
        chdir: '{{ stripe_repair_compose }}'
      changed_when: true
      when:
        - not ansible_check_mode
        - stripe_repair_patch.changed or stripe_repair_runtime.rc != 0

    - name: Deploy repaired API without restarting dependencies
      ansible.builtin.command:
        argv: '{{ stripe_repair_command + ["up", "-d", "--no-deps", "api"] }}' 
        chdir: '{{ stripe_repair_compose }}'
      changed_when: true
      when:
        - not ansible_check_mode
        - stripe_repair_patch.changed or stripe_repair_runtime.rc != 0

    - name: Verify deployed source syntax
      ansible.builtin.command:
        argv: '{{ stripe_repair_command + ["exec", "-T", "api", "node", "--check", "/app/walletFunding.js"] }}' 
        chdir: '{{ stripe_repair_compose }}'
      register: stripe_repair_syntax
      retries: 12
      delay: 5
      until: stripe_repair_syntax.rc == 0
      changed_when: false
      when: not ansible_check_mode

    - name: Verify unsupported parameter is absent in running API
      ansible.builtin.command:
        argv: '{{ stripe_repair_command + ["exec", "-T", "api", "node", "--input-type=module", "-e", stripe_repair_probe] }}' 
        chdir: '{{ stripe_repair_compose }}'
      changed_when: false
      when: not ansible_check_mode

    - name: Wait for public account API to respond
      ansible.builtin.uri:
        url: https://sip.dobhrap.com/api/me
        status_code: [200, 401]
        return_content: false
        timeout: 10
        follow_redirects: none
      register: stripe_repair_health
      retries: 12
      delay: 5
      until: stripe_repair_health is succeeded
      when: not ansible_check_mode

    - name: Report repair scope
      ansible.builtin.debug:
        msg: >-
          Repair checks completed. Payment methods are managed in Stripe Dashboard.
          This playbook does not create payments, change credentials, modify wallet balances,
          or push Git commits. In check mode no container is rebuilt or verified.
