- name: Deploy super-admin Twilio API credential controls
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tasks:
    - name: Preserve existing integrations, install credential controls and run tests
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        cd /opt/olamide/repo
        exec 9>/run/olamide-update.lock
        flock -n 9 || { echo 'Another deployment is running'; exit 1; }
        release=cab8b16732a680db387f68e9ebc99f6007727946
        git fetch origin main </dev/null
        git merge-base --is-ancestor "$release" origin/main
        for f in services/api/twilioHub.js apps/web/src/twilioHubUi.js apps/web/src/twilioRolesUi.js; do test -f "$f" || { echo "Existing Twilio hub required: $f"; exit 1; }; done
        backup="/opt/olamide/backups/twilio-credentials-$(date -u +%Y%m%dT%H%M%S)-$$"
        install -d -m 0700 "$backup"
        files=(services/api/twilioHub.js services/api/twilioCredentials.js services/api/twilioCredentials.test.js apps/web/src/twilioHubUi.js apps/web/src/twilioCredentialControls.js apps/web/src/twilioCredentialControls.test.js)
        for f in "${files[@]}"; do mkdir -p "$backup/source/$(dirname "$f")"; if test -f "$f"; then cp -p "$f" "$backup/source/$f"; fi; done
        cd deployment/docker
        docker compose config --quiet
        suffix=$(date +%s)-$$
        for svc in api web; do
          cid=$(docker compose ps -q "$svc")
          test -n "$cid"
          image=$(docker inspect "$cid" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["Image"])')
          docker tag "$image" "olamide-$svc:before-credentials-$suffix"
        done
        printf 'services:\n  api:\n    image: olamide-api:before-credentials-%s\n  web:\n    image: olamide-web:before-credentials-%s\n' "$suffix" "$suffix" > "$backup/rollback.yml"
        cd ../..
        runtime_changed=false
        recover() {
          trap - ERR
          for f in "${files[@]}"; do if test -f "$backup/source/$f"; then cp -p "$backup/source/$f" "/opt/olamide/repo/$f"; else rm -f "/opt/olamide/repo/$f"; fi; done
          if [[ "$runtime_changed" == true ]]; then
            cd /opt/olamide/repo/deployment/docker
            docker compose -f compose.yml -f "$backup/rollback.yml" up -d --no-deps api web </dev/null || true
          fi
          echo "Credential update stopped; prior sources restored and runtime restored where necessary. Schema/test history retained. Backup: $backup"
          exit 1
        }
        trap recover ERR
        for f in services/api/twilioCredentials.js services/api/twilioCredentials.test.js apps/web/src/twilioCredentialControls.js apps/web/src/twilioCredentialControls.test.js; do git show "$release:$f" > "$f"; done
        git show "$release:tools/install-twilio-credentials.py" > "$backup/install.py"
        git show "$release:tests/test_twilio_credential_installer.py" > "$backup/installer.test.py"
        TWILIO_CREDENTIAL_INSTALLER="$backup/install.py" python3 "$backup/installer.test.py"
        python3 "$backup/install.py"
        cd deployment/docker
        docker compose build api </dev/null
        docker compose run --rm --no-deps -T --entrypoint node api --test /app/twilioCredentials.test.js /app/twilioHub.test.js </dev/null
        docker compose run --rm --no-deps -T --entrypoint node api --check /app/twilioHub.js </dev/null
        cd ../..
        docker build -f deployment/docker/web.Dockerfile --target build -t olamide-twilio-credentials-ui-check . </dev/null
        docker run --rm --entrypoint node olamide-twilio-credentials-ui-check --test /app/src/twilioCredentialControls.test.js /app/src/twilioHubUi.test.js </dev/null
        cd deployment/docker
        docker compose build web </dev/null
        runtime_changed=true
        docker compose up -d --no-deps api web </dev/null
        curl -fsS --max-time 10 --retry 12 --retry-all-errors --retry-delay 3 https://sip.dobhrap.com/api/health
        docker compose exec -T api node --input-type=module <<'JS'
        import {createDatabase} from './db.js';
        const db=createDatabase(process.env.MYSQL_URL);
        try{await db.query('SELECT id FROM twilio_credential_tests LIMIT 0');console.log('Credential test-history schema verified. Saved secrets were not changed.');}finally{await db.end();}
        JS
        trap - ERR
        echo "Super admin > Providers & Routing > Twilio > API keys: individual Auth Token, API key pair, Verify, Messaging, SendGrid and Segment read-only test buttons and history installed. No remote resource or credential was changed by deployment. Backup: $backup"
      args:
        executable: /bin/bash
      register: twilio_key_install
    - name: Show credential controls result
      ansible.builtin.debug:
        msg: '{{ twilio_key_install.stdout_lines[-4:] }}'
