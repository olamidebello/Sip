- name: Register Twilio trunk OTP DID and SMS provider roles
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Preserve, integrate, test and deploy Twilio hub
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        cd /opt/olamide/repo
        exec 9>/run/olamide-update.lock
        flock -n 9 || { echo 'Another deployment is running'; exit 1; }
        test -f services/api/callerVerification.js
        git fetch origin main </dev/null
        release=09b9bc5d1ae71640bed0fdf09dcc8a7e9a8007f8
        git merge-base --is-ancestor "$release" origin/main
        backup="/opt/olamide/backups/twilio-hub-$(date -u +%Y%m%dT%H%M%S)-$$"
        install -d -m 0700 "$backup"
        files=(services/api/server.js services/api/callerVerification.js apps/web/src/main.js services/api/twilioHub.js services/api/twilioHub.test.js apps/web/src/twilioHubUi.js apps/web/src/twilioHubUi.test.js services/api/twilioAutoSetup.js services/api/twilioAutoSetup.test.js services/api/twilioRoles.js services/api/twilioRoles.test.js apps/web/src/twilioRolesUi.js apps/web/src/twilioRolesUi.test.js)
        for f in "${files[@]}"; do mkdir -p "$backup/source/$(dirname "$f")"; if test -f "$f"; then cp -p "$f" "$backup/source/$f"; fi; done
        cd deployment/docker
        docker compose config --quiet
        suffix=$(date +%s)-$$
        for svc in api web; do
         id=$(docker compose ps -q "$svc")
         test -n "$id" || { echo "Running service required: $svc"; exit 1; }
         image=$(docker inspect --format '{% raw %}{{.Image}}{% endraw %}' "$id")
         docker tag "$image" "olamide-$svc:before-twilio-$suffix"
        done
        printf 'services:\n  api:\n    image: olamide-api:before-twilio-%s\n  web:\n    image: olamide-web:before-twilio-%s\n' "$suffix" "$suffix" > "$backup/rollback.yml"
        cd ../..
        recover() {
         trap - ERR
         for f in "${files[@]}"; do if test -f "$backup/source/$f"; then cp -p "$backup/source/$f" "/opt/olamide/repo/$f"; else rm -f "/opt/olamide/repo/$f"; fi; done
         cd /opt/olamide/repo/deployment/docker
         docker compose -f compose.yml -f "$backup/rollback.yml" up -d --no-deps api web </dev/null || true
         echo "Twilio deployment stopped; previous source/images restored where available. Additive tables/invoices are retained. Backup: $backup"
         exit 1
        }
        trap recover ERR
        for f in services/api/twilioHub.js services/api/twilioHub.test.js apps/web/src/twilioHubUi.js apps/web/src/twilioHubUi.test.js services/api/twilioAutoSetup.js services/api/twilioAutoSetup.test.js services/api/twilioRoles.js services/api/twilioRoles.test.js apps/web/src/twilioRolesUi.js apps/web/src/twilioRolesUi.test.js; do git show "$release:$f" > "$f"; done
        git show "$release:tools/install-twilio-hub.py" > "$backup/install.py"
        python3 "$backup/install.py"
        cd deployment/docker
        docker compose build api </dev/null
        docker compose run --rm --no-deps -T --entrypoint node api --test /app/twilioRoles.test.js /app/twilioAutoSetup.test.js /app/twilioHub.test.js /app/callerVerification.test.js </dev/null
        docker compose run --rm --no-deps -T --entrypoint node api --check /app/server.js </dev/null
        docker compose run --rm --no-deps -T --entrypoint node api --check /app/callerVerification.js </dev/null
        cd ../..
        docker build -f deployment/docker/web.Dockerfile --target build -t olamide-twilio-ui-check . </dev/null
        docker run --rm --entrypoint node olamide-twilio-ui-check --test /app/src/twilioRolesUi.test.js /app/src/twilioHubUi.test.js /app/src/callerVerificationUi.test.js </dev/null
        cd deployment/docker
        docker compose build web </dev/null
        docker compose up -d --no-deps api web </dev/null
        curl -fsS --max-time 10 --retry 12 --retry-all-errors --retry-delay 3 https://sip.dobhrap.com/api/health
        docker compose exec -T api node --input-type=module <<'JS'
        import {createDatabase} from './db.js';
        import {roleSettings,registerRoles} from './twilioRoles.js';
        const db=createDatabase(process.env.MYSQL_URL);
        try {
         const admins=(await db.query("SELECT id,tenant_id,role FROM users WHERE role='super_admin' AND status='active' ORDER BY id")).rows;
         const tenants=new Map(admins.map(u=>[u.tenant_id,u]));
         for(const user of tenants.values()){const p=await roleSettings(db,user.tenant_id);if(p.version===0)console.log('Twilio role registration:',JSON.stringify(await registerRoles(db,user,p)));else console.log('Existing Twilio roles preserved for tenant:',user.tenant_id);}
        } finally {await db.end();}
        JS
        trap - ERR
        echo "Twilio provider roles installed. Administrator > Providers & Routing > Twilio. Customer Money/Billing > Twilio services marketplace. Save credentials and enable the verification Security policy. Prices cost plus 30%. Setup-required products are not live runtime adapters. No calls/messages or remote purchases were made. Backup: $backup"
      args:
        executable: /bin/bash
      register: twilio_install
    - name: Show Twilio installation result
      ansible.builtin.debug:
        msg: "{{ twilio_install.stdout_lines[-16:] }}"
