---
- name: Install user phone settings and incoming DID calling policies
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Create private phone feature rollback directory
      ansible.builtin.tempfile:
        state: directory
        path: /opt/olamide/backups
        prefix: user-phone-
      register: phone_backup
    - name: Back up, stage, validate and deploy phone settings
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        exec 9>/run/olamide-update.lock
        flock -n 9
        backup='{{ phone_backup.path }}'
        controller='{{ playbook_dir }}/../..'
        exec > "$backup/deploy.log" 2>&1
        cd /opt/olamide/repo
        cp -p /etc/kamailio/kamailio.cfg "$backup/kamailio.cfg"
        python3 - "$backup" <<'PY'
        from pathlib import Path
        import sys,json,shutil
        root=Path('/opt/olamide/repo');b=Path(sys.argv[1]);names=['services/api/'+n for n in ['server.js','pstnBilling.js','kamailioHttpBridge.js','phoneSettings.js','phoneSettings.test.js']]+['apps/web/src/'+n for n in ['main.js','phoneSettingsUi.js','phoneSettingsUi.test.js']]
        manifest={}
        for name in names:
            p=root/name
            if p.is_symlink():raise SystemExit('Symlinked integration file refused')
            manifest[name]=p.exists()
            if p.exists():
                target=b/'source'/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,target)
        (b/'manifest.json').write_text(json.dumps(manifest))
        PY
        cd deployment/docker
        for svc in api web; do
          container=$(docker compose ps -q "$svc")
          test -n "$container"
          image=$(docker inspect --format '{% raw %}{{.Image}}{% endraw %}' "$container")
          docker tag "$image" "olamide-$svc:phone-rollback-$(basename "$backup")"
        done
        printf 'services:\n  api:\n    image: olamide-api:phone-rollback-%s\n  web:\n    image: olamide-web:phone-rollback-%s\n' "$(basename "$backup")" "$(basename "$backup")" > "$backup/rollback.yml"
        promoted=0
        restore_runtime() {
          python3 - <<'PY'
        import json,pathlib,subprocess
        c=json.loads(pathlib.Path('/etc/olamide/carrier-adapter.json').read_text());p=pathlib.Path(c['stateFile']);assert p.exists()
        subprocess.run([c.get('kamcmd','/usr/sbin/kamcmd'),'-s',c['rpcSocket'],'htable.sets','olamide_carrier',c['tenantId'],p.read_text()],check=True,capture_output=True)
        PY
        }
        restore() {
          trap - ERR
          python3 - "$backup" <<'PY'
        import json,pathlib,shutil,sys
        b=pathlib.Path(sys.argv[1]);root=pathlib.Path('/opt/olamide/repo')
        for name,exists in json.loads((b/'manifest.json').read_text()).items():
            if exists:shutil.copy2(b/'source'/name,root/name)
            else:(root/name).unlink(missing_ok=True)
        PY
          cp -p "$backup/kamailio.cfg" /etc/kamailio/kamailio.cfg
          if test "$promoted" = 1; then
            docker compose -f compose.yml -f "$backup/rollback.yml" up -d --no-deps api web || true
            systemctl restart kamailio || true
            restore_runtime || true
          fi
          exit 1
        }
        trap restore ERR
        python3 "$controller/tools/prepare_phone_features.py" /etc/kamailio/kamailio.cfg "$backup/staged.cfg"
        kamailio -c -f "$backup/staged.cfg"
        python3 "$controller/tools/install_phone_features.py" /opt/olamide/repo
        for name in phoneSettings.js phoneSettings.test.js; do install -m 0644 "$controller/services/api/$name" "/opt/olamide/repo/services/api/$name"; done
        for name in phoneSettingsUi.js phoneSettingsUi.test.js; do install -m 0644 "$controller/apps/web/src/$name" "/opt/olamide/repo/apps/web/src/$name"; done
        docker compose build api web
        docker compose run --rm --no-deps -T --entrypoint node api --test /app/phoneSettings.test.js
        for name in server.js pstnBilling.js kamailioHttpBridge.js; do docker compose run --rm --no-deps -T --entrypoint node api --check "/app/$name"; done
        cmp /etc/kamailio/kamailio.cfg "$backup/kamailio.cfg"
        promoted=1
        docker compose up -d --no-deps api web
        curl -fsS --max-time 10 --retry 12 --retry-all-errors --retry-delay 2 https://sip.dobhrap.com/api/health
        install -o root -g kamailio -m 0640 "$backup/staged.cfg" /etc/kamailio/kamailio.cfg
        systemctl restart kamailio
        restore_runtime
        systemctl is-active --quiet kamailio
        trap - ERR
      args:
        executable: /bin/bash
      no_log: true
      changed_when: true
    - name: Report user phone settings installation
      ansible.builtin.debug:
        msg: 'Phone settings installed in Account. Incoming DID controls include Do Not Disturb, ring duration, one-hop forwarding to consenting workspace contacts and call waiting policy for compatible SIP clients. The browser remains a single-call dialer. Voicemail greeting and message access use *98. Reconnect devices after switch restart. Backup/private log: {{ phone_backup.path }}'
