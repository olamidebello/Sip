- name: Install WireGuard with embedded Android VPN and account controls
  hosts: all
  become: true
  gather_facts: false
  tasks:
  - name: Back up, build, validate and install VPN
    ansible.builtin.shell: "set -euo pipefail\numask 077\ncd /opt/olamide/repo\nexec 9>/run/olamide-update.lock\nflock -n 9 || { echo 'Another deployment is running'; exit 1; }\nif test -f /var/lib/olamide/firewall/pending.json; then echo 'Finish or roll back the pending firewall checkpoint first'; exit 1; fi\nif systemctl is-active --quiet firewalld; then echo 'Review existing firewalld before VPN setup'; exit 1; fi\nif command -v ufw >/dev/null && ufw status | grep -q '^Status: active'; then echo 'Review existing UFW before VPN setup'; exit 1; fi\ncurl -fsS --max-time 15 https://sip.dobhrap.com/api/health\nbackup_dir=\"/opt/olamide/backups/vpn-$(date -u +%Y%m%dT%H%M%S)-$$\"\ninstall -d -m 0700 \"$backup_dir\"\ngit fetch origin main </dev/null\nrelease=e4201dde254c3be45698cfd836aabc10e6ff50cd\ngit merge-base --is-ancestor \"$release\" origin/main\nfor f in vpn-agent.py vpn-network.py setup-vpn-host.py rollback-vpn-network.py install-vpn-integration.py test_vpn_agent.py olamide-firewall.py repair-media-route.py; do git show \"$release:tools/$f\" > \"$backup_dir/$f\"; done\npython3 \"$backup_dir/test_vpn_agent.py\"\nfiles=(services/api/server.js services/api/kamailioHttpBridge.js apps/web/src/main.js services/api/vpn.js services/api/vpn.test.js apps/web/src/vpnUi.js apps/web/src/vpnNativeClient.js deployment/docker/compose.yml)\nfor f in \"${files[@]}\"; do\n  mkdir -p \"$backup_dir/source/$(dirname \"$f\")\"\n  if test -f \"$f\"; then cp -p \"$f\" \"$backup_dir/source/$f\"; fi\ndone\nold_vpn=0\nif systemctl is-active --quiet wg-quick@wg-olamide; then old_vpn=1; fi\nif test \"$old_vpn\" = 0 && ip link show wg-olamide >/dev/null 2>&1; then echo 'Unmanaged wg-olamide interface exists; review first'; exit 1; fi\nforwarding=$(sysctl -n net.ipv4.ip_forward)\nfor f in /etc/olamide/vpn/server.json /etc/wireguard/wg-olamide.conf /etc/systemd/system/olamide-vpn-agent.service /etc/systemd/system/olamide-vpn-network.service /etc/systemd/system/wg-quick@wg-olamide.service.d/olamide.conf /usr/local/lib/olamide-vpn/vpn-agent.py /usr/local/lib/olamide-vpn/vpn-network.py /usr/local/lib/olamide-vpn/rollback-vpn-network.py; do\n  if test -f \"$f\"; then mkdir -p \"$backup_dir/host$(dirname \"$f\")\"; cp -p \"$f\" \"$backup_dir/host$f\"; fi\ndone\nrecover() {\n  trap - ERR\n  for f in \"${files[@]}\"; do\n    if test -f \"$backup_dir/source/$f\"; then cp -p \"$backup_dir/source/$f\" \"/opt/olamide/repo/$f\"; else rm -f \"/opt/olamide/repo/$f\"; fi\n  done\n  if test \"$old_vpn\" = 0; then\n    systemctl disable --now olamide-vpn-agent.service wg-quick@wg-olamide.service olamide-vpn-network.service 2>/dev/null || true\n    python3 \"$backup_dir/rollback-vpn-network.py\" || true\n    sysctl -w \"net.ipv4.ip_forward=$forwarding\" >/dev/null\n  else\n    cp -a \"$backup_dir/host/.\" / || true\n    systemctl daemon-reload\n    systemctl restart olamide-vpn-network wg-quick@wg-olamide olamide-vpn-agent || true\n  fi\n  if test -f \"$backup_dir/rollback.yml\"; then cd /opt/olamide/repo/deployment/docker; docker compose -f compose.yml -f \"$backup_dir/rollback.yml\" up -d --no-deps api web </dev/null || true; fi\n  echo \"VPN install stopped; source/images restored where available. Backup: $backup_dir\"\n  exit 1\n}\ntrap recover ERR\n# Installing nftables must not start its distribution service or flush Docker rules.\nnew_nft=0\nif ! dpkg-query -W -f='${Status}' nftables 2>/dev/null | grep -q 'install ok installed'; then\n  new_nft=1; systemctl mask --runtime nftables.service\nfi\nexport DEBIAN_FRONTEND=noninteractive\napt-get update -q > \"$backup_dir/packages.log\" 2>&1\napt-get install -y --no-upgrade --no-install-recommends wireguard-tools nftables iptables python3-yaml >> \"$backup_dir/packages.log\" 2>&1\nif test \"$new_nft\" = 1; then systemctl unmask --runtime nftables.service; systemctl disable nftables.service; fi\nmodprobe wireguard\ninstall -d -m 0700 /var/lib/olamide/vpn\ninstall -d -m 0755 /usr/local/lib/olamide-vpn /run/olamide-vpn\nfor f in vpn-agent.py vpn-network.py rollback-vpn-network.py; do install -m 0755 \"$backup_dir/$f\" \"/usr/local/lib/olamide-vpn/$f\"; done\nif grep -q OLAMIDE_SOFTPHONE_ICE_V1 services/api/server.js; then python3 \"$backup_dir/repair-media-route.py\"; fi\npython3 \"$backup_dir/install-vpn-integration.py\"\nfor f in services/api/vpn.js services/api/vpn.test.js apps/web/src/vpnUi.js apps/web/src/vpnNativeClient.js; do git show \"$release:$f\" > \"$f\"; done\ncd deployment/docker\npython3 \"$backup_dir/setup-vpn-host.py\" \"$backup_dir\"\ndocker compose config --quiet </dev/null\nsuffix=$(date +%s)-$$\napi_id=$(docker inspect --format '{% raw %}{{.Image}}{% endraw %}' \"$(docker compose ps -q api)\")\nweb_id=$(docker inspect --format '{% raw %}{{.Image}}{% endraw %}' \"$(docker compose ps -q web)\")\ndocker tag \"$api_id\" \"olamide-api:before-vpn-$suffix\"\ndocker tag \"$web_id\" \"olamide-web:before-vpn-$suffix\"\nprintf 'services:\\n  api:\\n    image: olamide-api:before-vpn-%s\\n  web:\\n    image: olamide-web:before-vpn-%s\\n' \"$suffix\" \"$suffix\" > \"$backup_dir/rollback.yml\"\ndocker compose build api web </dev/null\ndocker compose run --rm --no-deps -T --entrypoint node api --test /app/vpn.test.js </dev/null\ndocker compose run --rm --no-deps -T --entrypoint node api --check /app/server.js </dev/null\ncat > /etc/systemd/system/olamide-vpn-network.service <<'UNIT'\n[Unit]\nDescription=Olamide VPN isolated forwarding and NAT policy\nAfter=network-online.target olamide-firewall.service docker.service\nWants=network-online.target\nBefore=wg-quick@wg-olamide.service\n[Service]\nType=oneshot\nExecStart=/usr/bin/python3 /usr/local/lib/olamide-vpn/vpn-network.py\nRemainAfterExit=yes\n[Install]\nWantedBy=multi-user.target\nUNIT\nmkdir -p /etc/systemd/system/wg-quick@wg-olamide.service.d\ncat > /etc/systemd/system/wg-quick@wg-olamide.service.d/olamide.conf <<'UNIT'\n[Unit]\nRequires=olamide-vpn-network.service\nAfter=olamide-vpn-network.service\nUNIT\ncat > /etc/systemd/system/olamide-vpn-agent.service <<'UNIT'\n[Unit]\nDescription=Olamide private WireGuard account provisioning\nAfter=wg-quick@wg-olamide.service docker.service\nRequires=wg-quick@wg-olamide.service\n[Service]\nType=simple\nUser=root\nUMask=0077\nRuntimeDirectory=olamide-vpn\nRuntimeDirectoryMode=0755\nRuntimeDirectoryPreserve=yes\nExecStart=/usr/bin/python3 /usr/local/lib/olamide-vpn/vpn-agent.py\nRestart=on-failure\nRestartSec=5\nNoNewPrivileges=true\nProtectSystem=strict\nReadWritePaths=/var/lib/olamide/vpn /run/olamide-vpn\nCapabilityBoundingSet=CAP_NET_ADMIN CAP_CHOWN CAP_FOWNER\n[Install]\nWantedBy=multi-user.target\nUNIT\nsystemctl daemon-reload\nsystemctl enable olamide-vpn-network.service wg-quick@wg-olamide.service olamide-vpn-agent.service\nsystemctl restart olamide-vpn-network.service\nsystemctl start wg-quick@wg-olamide.service\nsystemctl restart olamide-vpn-agent.service\nsleep 2\ndocker compose up -d --no-deps api web </dev/null\ncurl -fsS --max-time 10 --retry 12 --retry-all-errors --retry-delay 3 https://sip.dobhrap.com/api/health\nsystemctl is-active --quiet wg-quick@wg-olamide.service olamide-vpn-agent.service\npython3 - <<'PYCHECK'\nimport json,urllib.request\nfrom pathlib import Path\nconfig=json.loads(Path('/etc/olamide/vpn/server.json').read_text())\nr=urllib.request.Request('http://127.0.0.1:18080/api/switch/kamailio/vpn-accounts',data=b'{}',headers={'Authorization':'Bearer '+config['bridgeToken'],'Content-Type':'application/json'})\nwith urllib.request.urlopen(r,timeout=5) as response:assert isinstance(json.load(response)['users'],list)\nPYCHECK\ntrap - ERR\necho \"VPN installed. UDP 51820; My VPN under user settings; Administrator > VPN management. The new Android APK embeds VPN; approve Android permission. Browsers require an external VPN client. Backup: $backup_dir\"\n"
    args:
      executable: /bin/bash
    register: vpn_result
    changed_when: true
  - name: Show VPN result
    ansible.builtin.debug:
      msg: '{{ vpn_result.stdout_lines[-20:] }}'
