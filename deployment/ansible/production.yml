---
- name: Validate unattended production inputs before any server changes
  hosts: localhost
  connection: local
  become: false
  any_errors_fatal: true
  tasks:
  - name: Require fixed release, explicit maintenance and single supported application host
    ansible.builtin.assert:
      that:
      - deployment_ref is match('^[0-9a-f]{40}$')
      - app_repo | default('/opt/olamide/repo') == '/opt/olamide/repo'
      - app_domain is match('^[a-z0-9.-]+$')
      - production_public_ip is defined
      - initial_admin_email is defined
      - production_maintenance_approved | default(false) | bool
      - groups['olamide'] | default([]) | length == 1
      - production_acceptance_argv | default([]) is sequence
      - production_acceptance_argv | default([]) is not string
      - production_acceptance_argv | default([]) | length > 0
      - not (production_require_offsite_backup | default(true) | bool) or production_backup_argv | default([]) | length > 0
      - not (production_require_native | default(false) | bool) or (enable_native_push | default(false) | bool)
      - not (production_require_native | default(false) | bool) or native_device_acceptance_argv | default([]) | length > 0
      - not (build_native_ios | default(false) | bool) or (ios_native_media_verified | default(false) | bool)
      - not (build_native_ios | default(false) | bool) or (enable_native_push | default(false) | bool)
      - not (build_native_android | default(false) | bool) or (enable_native_push | default(false) | bool)
      - production_backup_argv | default([]) is sequence
      - production_backup_argv | default([]) is not string
      - native_device_acceptance_argv | default([]) is sequence
      - native_device_acceptance_argv | default([]) is not string
      - not (build_native_ios | default(false) | bool) or (production_require_native | default(false) | bool)
      - initial_admin_email is match('^[^@\s]+@[^@\s]+\.[^@\s]+$')
      fail_msg: Supply private config, a drained maintenance window, off-host backup command and real-call acceptance command. Native iOS production
        additionally requires a verified native SIP/media engine.
  - name: Verify public IPv4 input
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - import ipaddress,sys; a=ipaddress.ip_address(sys.argv[1]); assert a.version==4 and a.is_global
      - '{{ production_public_ip }}'
    changed_when: false
  - name: Check controller DNS before TLS commissioning
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - import socket,sys; assert sys.argv[2] in {x[4][0] for x in socket.getaddrinfo(sys.argv[1],443,type=socket.SOCK_STREAM)}
      - '{{ app_domain }}'
      - '{{ production_public_ip }}'
    changed_when: false
  - name: Require same-server inventory and profile data when commissioning
    ansible.builtin.assert:
      that:
      - groups['switch_nodes'] | default([]) == groups['olamide']
      - kamailio_maintenance_approved | default(false) | bool
      - sip_domain == app_domain
      - sip_public_ip == production_public_ip
      - kamailio_config_source is defined
      - rtpengine_config_source is defined
      - sip_registration_config_source is defined
      - not (pbx_enabled | default(false) | bool)
      - not (freeswitch_cluster_enabled | default(false) | bool)
    when: (commission_same_server | default(false) | bool) or (commission_sip_accounts | default(false) | bool)
  - name: Validate supplied push and build credentials before starting rollout
    ansible.builtin.assert:
      that:
      - firebase_service_account_source is defined
      - not (build_native_android | default(false) | bool) or google_services_source is defined
      - not (build_native_android | default(false) | bool) or groups['mobile_builders'] | default([]) | length > 0
      - not (build_native_ios | default(false) | bool) or groups['ios_builders'] | default([]) | length > 0
      - not (build_native_ios | default(false) | bool) or apns_key_source is defined
    when: enable_native_push | default(false) | bool
- name: Prepare Debian and deploy complete application services
  hosts: olamide
  become: true
  any_errors_fatal: true
  vars:
    app_repo: /opt/olamide/repo
  pre_tasks:
  - name: Require Debian 12 and supported CPU architecture
    ansible.builtin.assert:
      that:
      - ansible_distribution == 'Debian'
      - ansible_distribution_major_version == '12'
      - ansible_architecture in ['x86_64', 'aarch64']
  - name: Verify acceptance program is already present on server
    ansible.builtin.stat:
      path: '{{ production_acceptance_argv[0] }}'
    register: acceptance_program
  - name: Require executable acceptance program
    ansible.builtin.assert:
      that:
      - production_acceptance_argv[0] is match('^/')
      - acceptance_program.stat.exists
      - acceptance_program.stat.executable
      fail_msg: Install a reviewed SIP/audio acceptance probe on the server before unattended production rollout.
  - name: Verify required off-host backup uploader is installed
    ansible.builtin.stat:
      path: '{{ production_backup_argv[0] }}'
    register: backup_program
    when: production_backup_argv | default([]) | length > 0
  - name: Require absolute executable off-host backup uploader
    ansible.builtin.assert:
      that:
      - production_backup_argv[0] is match('^/')
      - backup_program.stat.exists
      - backup_program.stat.executable
    when: production_backup_argv | default([]) | length > 0
  tasks:
  - name: Install base host tools and Debian security updates
    ansible.builtin.apt:
      name:
      - ca-certificates
      - curl
      - git
      - openssl
      - python3
      - python3-apt
      - unattended-upgrades
      state: present
      update_cache: true
  - name: Enable automatic security updates without call-interrupting reboots
    ansible.builtin.copy:
      dest: /etc/apt/apt.conf.d/52olamide-production-security
      mode: '0644'
      content: 'APT::Periodic::Update-Package-Lists "1";

        APT::Periodic::Unattended-Upgrade "1";

        Unattended-Upgrade::Automatic-Reboot "false";

        '
  - name: Inspect Docker Compose toolchain
    ansible.builtin.command:
      argv:
      - docker
      - compose
      - version
    register: docker_probe
    changed_when: false
    failed_when: false
  - name: Install official Docker toolchain when missing
    when: docker_probe.rc != 0
    block:
    - name: Create package key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    - name: Install Docker repository signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
    - name: Configure official Debian Docker repository
      ansible.builtin.apt_repository:
        repo: deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian
          bookworm stable
        filename: docker
        state: present
    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        state: present
        update_cache: true
  - name: Enable Docker at boot
    ansible.builtin.systemd:
      name: docker
      enabled: true
      state: started
  - name: Verify Docker Compose supports explicit service readiness
    ansible.builtin.command:
      argv:
      - docker
      - compose
      - up
      - --help
    register: compose_help
    changed_when: false
    failed_when: compose_help.rc != 0 or '--wait-timeout' not in compose_help.stdout
  - name: Probe MySQL virtual CPU compatibility without modifying volumes
    ansible.builtin.command:
      argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - /bin/true
      - mysql:8.4
    changed_when: false
  - name: Create private production directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      owner: root
      group: root
      mode: '0700'
    loop:
    - /etc/olamide
    - /opt/olamide
    - /opt/olamide/backups
    - /usr/local/lib/olamide-production
  - name: Stage production deployment helpers
    ansible.builtin.copy:
      src: ../production/{{ item }}
      dest: /usr/local/lib/olamide-production/{{ item }}
      mode: '0700'
    loop:
    - runtime-secrets.py
    - release.py
    - check-public.py
  - name: Install importable helper module
    ansible.builtin.copy:
      src: ../production/runtime-secrets.py
      dest: /usr/local/lib/olamide-production/runtime_secrets.py
      mode: '0600'
  - name: Stage optional private environment inputs
    ansible.builtin.copy:
      src: '{{ production_secrets_source }}'
      dest: /etc/olamide/production-input.env
      mode: '0600'
    when: production_secrets_source is defined
    no_log: true
  - name: Inspect existing legacy update timer
    ansible.builtin.command:
      argv:
      - systemctl
      - cat
      - olamide-update.timer
    register: legacy_update_timer
    changed_when: false
    failed_when: false
  - name: Stop legacy updater to prevent uncoordinated deployments
    ansible.builtin.systemd:
      name: olamide-update.timer
      state: stopped
      enabled: false
    when: legacy_update_timer.rc == 0
  - name: Wait for any active legacy update to finish
    ansible.builtin.command:
      argv:
      - flock
      - -w
      - '600'
      - /run/olamide-update.lock
      - /bin/true
    changed_when: false
  - name: Invalidate prior acceptance before changing the application release
    ansible.builtin.copy:
      dest: /opt/olamide/production-readiness.json
      owner: root
      group: root
      mode: '0600'
      content: '{{ {''release'': deployment_ref, ''status'': ''pending_acceptance'', ''production_accepted'': false} | to_nice_json }}'
  - name: Generate missing internal credentials and preserve existing identities
    ansible.builtin.command:
      argv: '{{ [ ''python3'', ''/usr/local/lib/olamide-production/runtime-secrets.py'', ''--canonical'', ''/etc/olamide/secrets.env'', ''--deployed'',
        app_repo + ''/deployment/docker/.env'', ''--domain'', app_domain, ''--public-ip'', production_public_ip, ''--admin-email'', initial_admin_email
        ] + ([''--supplied'', ''/etc/olamide/production-input.env''] if production_secrets_source is defined else []) }}'
    no_log: true
  - name: Deploy immutable release with database backup and application rollback
    ansible.builtin.command:
      argv:
      - python3
      - /usr/local/lib/olamide-production/release.py
      - --repo
      - '{{ app_repo }}'
      - --ref
      - '{{ deployment_ref }}'
      - --backup-argv-json
      - '{{ production_backup_argv | default([]) | to_json }}'
    no_log: true
  - name: Install boot unit using installed images and explicit database readiness
    ansible.builtin.copy:
      dest: /etc/systemd/system/olamide-compose.service
      mode: '0644'
      content: '[Unit]

        Description=Olamide validated production containers

        Requires=docker.service

        After=docker.service network-online.target

        Wants=network-online.target

        [Service]

        Type=oneshot

        RemainAfterExit=yes

        WorkingDirectory=/opt/olamide/repo/deployment/docker

        ExecStart=/usr/bin/docker compose -f compose.yml -f /etc/olamide/production-images.json up -d --wait --wait-timeout 300 mysql turn

        ExecStart=/usr/bin/docker compose -f compose.yml -f /etc/olamide/production-images.json up -d --no-deps --no-build api web

        ExecStop=/usr/bin/docker compose -f compose.yml -f /etc/olamide/production-images.json stop api web turn

        TimeoutStartSec=360

        [Install]

        WantedBy=multi-user.target

        '
  - name: Enable validated application boot service
    ansible.builtin.systemd:
      name: olamide-compose.service
      enabled: true
      daemon_reload: true
  - name: Verify external TLS and GUI before commissioning optional profiles
    ansible.builtin.command:
      argv:
      - python3
      - /usr/local/lib/olamide-production/check-public.py
      - --domain
      - '{{ app_domain }}'
    register: initial_https
    until: initial_https.rc == 0
    retries: 12
    delay: 5
    changed_when: false
- name: Commission optional reviewed same-server Kamailio and media relay
  ansible.builtin.import_playbook: ../../deploy/ansible/same-server.yml
  when: commission_same_server | default(false) | bool
- name: Commission optional authenticated SIP account provisioning
  ansible.builtin.import_playbook: ../../deploy/ansible/sip-accounts.yml
  when: commission_sip_accounts | default(false) | bool
- name: Provision optional Firebase credentials
  ansible.builtin.import_playbook: firebase-provision.yml
  when: (enable_native_push | default(false) | bool) and (auto_provision_firebase | default(false) | bool) and not (build_native_ios | default(false)
    | bool)
- name: Deploy Android push and optional native build
  ansible.builtin.import_playbook: native-push.yml
  when: (enable_native_push | default(false) | bool) and not (build_native_ios | default(false) | bool)
- name: Build optional Android application
  ansible.builtin.import_playbook: native-mobile.yml
  when: (build_native_android | default(false) | bool) and not (build_native_ios | default(false) | bool)
- name: Deploy Apple provider and signed native system-call builds
  ansible.builtin.import_playbook: native-system-calls.yml
  when: build_native_ios | default(false) | bool
- name: Verify production service and real-call acceptance
  hosts: olamide
  become: true
  any_errors_fatal: true
  tasks:
  - name: Verify public HTTPS GUI and optional SIP WebSocket protocol
    ansible.builtin.command:
      argv: '{{ [''python3'', ''/usr/local/lib/olamide-production/check-public.py'', ''--domain'', app_domain, ''--release'', deployment_ref]
        + ([''--sip''] if production_require_sip | default(true) | bool else []) }}'
    changed_when: false
  - name: Require local automatic SIP provisioning for the calling profile
    ansible.builtin.command:
      argv:
      - docker
      - compose
      - exec
      - -T
      - api
      - node
      - -e
      - if(process.env.SIP_PROVISION_MODE!=='kamailio_local'||!process.env.SIP_CREDENTIAL_KEY)process.exit(1)
      chdir: /opt/olamide/repo/deployment/docker
    when: production_require_sip | default(true) | bool
    changed_when: false
    no_log: true
  - name: Execute reviewed authenticated-call audio and access-control acceptance
    ansible.builtin.command:
      argv: '{{ production_acceptance_argv }}'
    changed_when: false
    no_log: true
  - name: Execute required physical native-device acceptance
    ansible.builtin.command:
      argv: '{{ native_device_acceptance_argv }}'
    when: production_require_native | default(false) | bool
    changed_when: false
    no_log: true
  - name: Record completed acceptance without disclosing credentials
    ansible.builtin.copy:
      dest: /opt/olamide/production-readiness.json
      owner: root
      group: root
      mode: '0600'
      content: '{{ {''release'': deployment_ref, ''status'': ''configured_profiles_accepted'', ''https_and_gui'': true, ''database_migration'':
        true, ''real_call_acceptance'': true, ''sip_transport'': production_require_sip | default(true) | bool, ''native_device_acceptance'':
        production_require_native | default(false) | bool, ''scope'': ''Configured profiles only; no claim of unimplemented WhatsApp features
        or native iOS media support''} | to_nice_json }}

        '
