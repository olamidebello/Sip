---
- name: Provision optional Firebase cloud resources and credentials
  ansible.builtin.import_playbook: firebase-provision.yml
  when: auto_provision_firebase | default(false) | bool
- name: Roll out available Olamide calling and messaging experience
  hosts: olamide
  become: true
  vars:
    app_repo: /opt/olamide/repo
  tasks:
    - name: Require a validated immutable release
      ansible.builtin.assert:
        that:
          - deployment_ref is defined
          - deployment_ref is match('^[0-9a-f]{40}$')
    - name: Require clean deployed source
      ansible.builtin.command:
        argv: [git, status, --porcelain, --untracked-files=no]
        chdir: '{{ app_repo }}'
      register: source_status
      changed_when: false
      failed_when: source_status.stdout | length > 0
    - name: Read deployed revision
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: '{{ app_repo }}'
      register: deployed_ref
      changed_when: false
    - name: Deploy available features with rollback
      block:
        - name: Fetch release from GitHub
          ansible.builtin.git:
            repo: https://github.com/olamidebello/Sip.git
            dest: '{{ app_repo }}'
            version: '{{ deployment_ref }}'
            force: false
        - name: Build API and web GUI
          ansible.builtin.command:
            argv: [docker, compose, build, api, web]
            chdir: '{{ app_repo }}/deployment/docker'
        - name: Apply additive schema updates
          ansible.builtin.command:
            argv: [docker, compose, run, --rm, migrate]
            chdir: '{{ app_repo }}/deployment/docker'
        - name: Start updated app and GUI
          ansible.builtin.command:
            argv: [docker, compose, up, '-d', '--no-deps', api, web]
            chdir: '{{ app_repo }}/deployment/docker'
        - name: Verify application readiness
          ansible.builtin.command:
            argv: [docker, compose, exec, '-T', api, node, '-e', "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
            chdir: '{{ app_repo }}/deployment/docker'
          register: experience_health
          until: experience_health.rc == 0
          retries: 12
          delay: 5
          changed_when: false
      rescue:
        - name: Restore previous release
          ansible.builtin.command:
            argv: [git, checkout, --detach, '{{ deployed_ref.stdout }}']
            chdir: '{{ app_repo }}'
        - name: Rebuild previous API and GUI
          ansible.builtin.command:
            argv: [docker, compose, build, api, web]
            chdir: '{{ app_repo }}/deployment/docker'
        - name: Restart previous API and GUI
          ansible.builtin.command:
            argv: [docker, compose, up, '-d', '--no-deps', api, web]
            chdir: '{{ app_repo }}/deployment/docker'
        - name: Report failed rollout
          ansible.builtin.fail:
            msg: Experience rollout failed; previous release restored. Additive schema retained.
    - name: Record installed experience and explicit acceptance requirements
      ansible.builtin.copy:
        dest: /opt/olamide/experience-readiness.json
        mode: '0644'
        content: |
          {{ {'release': deployment_ref, 'installed': ['contact CSV and vCard import', 'opt-in workspace search', 'presence and status', 'reply edit remove reactions', 'typing and read receipts', 'mute block archive', 'app call forwarding', 'message forwarding copies', 'automatic SIP login and reconnect'], 'acceptance_required': ['actual SIP registration and two-way audio', 'Firebase authorization and native notification permission', 'background Android call wake and late SIP branch delivery'], 'not_implemented': ['WhatsApp end-to-end encryption', 'WhatsApp account/network interoperability', 'native iOS SIP/media engine for suspended WebView calls', 'stories/status media', 'WhatsApp-scale group calling']} | to_nice_json }}
- name: Deploy optional Android push backend and SIP wake integration
  ansible.builtin.import_playbook: native-push.yml
  when: enable_native_push | default(false) | bool
- name: Build optional Android native package
  ansible.builtin.import_playbook: native-mobile.yml
  when: build_native_android | default(false) | bool
