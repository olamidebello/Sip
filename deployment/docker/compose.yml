services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in secrets.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set in secrets.env}
      MYSQL_USER: ${MYSQL_USER:?set in secrets.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in secrets.env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [private]
  api:
    image: olamide-api:local
    build:
      context: ../..
      dockerfile: deployment/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_URL: ${MYSQL_URL:?set in secrets.env}
      PUBLIC_ORIGIN: https://${DOMAIN:?set domain}
      LISTEN_ADDR: 0.0.0.0
      PORT: "8080"
      NODE_ENV: production
      MEETING_ICE_SERVERS_JSON: ${MEETING_ICE_SERVERS_JSON:-[]}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_PUBLIC_HOST: ${TURN_PUBLIC_HOST:-}
      FLOWROUTE_ACCESS_KEY: ${FLOWROUTE_ACCESS_KEY:-}
      FLOWROUTE_SECRET_KEY: ${FLOWROUTE_SECRET_KEY:-}
      FLOWROUTE_WEBHOOK_TOKEN: ${FLOWROUTE_WEBHOOK_TOKEN:-}
      FLOWROUTE_WEBHOOK_TENANT_ID: ${FLOWROUTE_WEBHOOK_TENANT_ID:-}
      DIDWW_API_KEY: ${DIDWW_API_KEY:-}
      DIDWW_API_ENV: ${DIDWW_API_ENV:-}
      DIDWW_TENANT_ID: ${DIDWW_TENANT_ID:-}
      DIDWW_ACCOUNT_CURRENCY: ${DIDWW_ACCOUNT_CURRENCY:-}
      DIDWW_CALLBACK_SECRET: ${DIDWW_CALLBACK_SECRET:-}
      DIDWW_CALL_EVENTS_TOKEN: ${DIDWW_CALL_EVENTS_TOKEN:-}
      CDR_INGEST_KEYS_JSON: ${CDR_INGEST_KEYS_JSON:-}
      LDAP_TENANTS_JSON: ${LDAP_TENANTS_JSON:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OPENAI_SUPPORT_API_KEY: ${OPENAI_SUPPORT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_CONFIG_KEY: ${AI_CONFIG_KEY:-}
      OPENAI_SUPPORT_MODEL: ${OPENAI_SUPPORT_MODEL:-gpt-4.1-mini}
      RESEND_FROM: ${RESEND_FROM:-}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-}
      EMAIL_CONFIG_KEY: ${EMAIL_CONFIG_KEY:-}
      SIP_CREDENTIAL_KEY: ${SIP_CREDENTIAL_KEY:-}
      PROVIDER_CREDENTIAL_KEY: ${PROVIDER_CREDENTIAL_KEY:-}
      FREESWITCH_XML_PASSWORD: ${FREESWITCH_XML_PASSWORD:-}
      KAMAILIO_ROUTE_TOKEN: ${KAMAILIO_ROUTE_TOKEN:-}
      DEPLOY_RUNNER_TOKEN: ${DEPLOY_RUNNER_TOKEN:-}
      PAYMENT_CONFIG_KEY: ${PAYMENT_CONFIG_KEY:-}
      SIP_PROVISION_URL: ${SIP_PROVISION_URL:-}
      SIP_PROVISION_TOKEN: ${SIP_PROVISION_TOKEN:-}
      CARRIER_PROVISION_URL: ${CARRIER_PROVISION_URL:-}
      CARRIER_PROVISION_TOKEN: ${CARRIER_PROVISION_TOKEN:-}
      CARRIER_ADAPTER_TARGETS_JSON: ${CARRIER_ADAPTER_TARGETS_JSON:-}
    # Host-only bridge for the staged SIP authorization adapter.
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [private]
  migrate:
    image: olamide-api:local
    command: ["node", "migrate.js"]
    restart: "no"
    environment:
      MYSQL_URL: ${MYSQL_URL:?set in secrets.env}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [private]
  web:
    build:
      context: ../..
      dockerfile: deployment/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set domain}
    ports:
      - "80:80"
      - "443:443"
    depends_on: [api]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]
  turn:
    profiles: [turn]
    build:
      context: ../..
      dockerfile: deployment/docker/turn.Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?set domain}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:-}
      TURN_SECRET: ${TURN_SECRET:-}
networks:
  private:
volumes:
  mysql_data:
  caddy_data:
  caddy_config:
